# CI: her PR'da ve main'e her push'ta uretim imaji derlenir, acilir ve iki seyi denetler (docs/deployment/ci-cd.md):
#   1. /health 200 doner (imaj veri olmadan acilabiliyor),
#   2. kimlik kapisi acik: oturumsuz /api istegi 401 (AUTH_ENABLED=False ile cikilmaz).
# Python testleri burada kosmaz: cogu git disi veriye (panel, arsiv) bagli; ayri is olarak eklenir.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Imaj derle + saglik
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Temel imaj (docker/base.Dockerfile) GHCR'de varsa cekilir; yoksa (requirements.txt degisen PR) burada derlenir,
      # ITILMEZ (itme yalniz Deploy'da).
      - name: Temel imaj
        run: |
          base="ghcr.io/softdevcan/rl-trading-base:$(bash scripts/deploy/base_tag.sh)"
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
          if docker pull -q "$base"; then
            echo "temel imaj GHCR'den: $base"
          else
            echo "temel imaj yok, yerelde derleniyor: $base"
            docker build -f docker/base.Dockerfile -t "$base" .
          fi

      - name: Derle
        run: docker build --build-arg BASE_IMAGE="$BASE" --build-arg GIT_COMMIT="${{ github.sha }}" -t rltrading:ci .

      - name: Ac ve /health bekle
        run: |
          docker run -d --name rlt -p 127.0.0.1:8000:8000 \
            -e DEBUG=False -e AUTH_ENABLED=True \
            -e JWT_SECRET_KEY="$(openssl rand -base64 48)" \
            rltrading:ci
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; exit 0; fi
            sleep 3
          done
          docker logs rlt
          exit 1

      - name: Kimlik kapisi acik mi
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/marl/forward/status)
          echo "oturumsuz /api/marl/forward/status -> $code"
          test "$code" = 401

      - name: M8 ileri veri isinin dosyalari imajda mi (Faz 11 §3.12)
        run: |
          docker exec rlt sh -c 'for f in scripts/marl/forward_panel_m8.py scripts/marl/handover_parity.py \
            docs/development/measurements/phase10-m8/m8_reading.json marl/margin_source_checks.json; do
            test -f "$f" || { echo "imajda yok: $f"; exit 1; }; done; test -d data/marl && echo "dosyalar tamam"'
          docker exec rlt python -c "import importlib.util as u; s=u.spec_from_file_location('m','scripts/marl/forward_panel_m8.py'); m=u.module_from_spec(s); s.loader.exec_module(m); c=m.git_head(); print('commit:', c); assert c == '${{ github.sha }}'"

      - name: Konteyner gunlugu
        if: always()
        run: docker logs rlt 2>&1 | tail -60 || true
