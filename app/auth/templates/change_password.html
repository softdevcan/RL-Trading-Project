<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parola degistir — RL Trading</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --card2: #334155; --text: #e2e8f0;
      --muted: #94a3b8; --border: #475569; --blue: #3b82f6; --red: #ef4444;
      --yellow: #eab308;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; background: var(--bg); color: var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .card {
      width: 100%; max-width: 420px; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; padding: 32px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, .45);
    }
    h1 { margin: 0 0 4px; font-size: 20px; }
    .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
    label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--muted); }
    input {
      width: 100%; padding: 11px 12px; margin-bottom: 16px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card2); color: var(--text);
      font-size: 14px;
    }
    input:focus { outline: 2px solid var(--blue); border-color: var(--blue); }
    button {
      width: 100%; padding: 11px; border: 0; border-radius: 8px; background: var(--blue);
      color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .alert {
      padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 18px;
      border: 1px solid var(--red); background: rgba(239, 68, 68, .12); color: #fecaca;
    }
    .notice {
      padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 18px;
      border: 1px solid var(--yellow); background: rgba(234, 179, 8, .12); color: #fde68a;
    }
    .rules { color: var(--muted); font-size: 12px; margin: -6px 0 18px; line-height: 1.6; }
    .foot { margin-top: 16px; text-align: center; font-size: 12px; }
    .foot a { color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Parola degistir</h1>
    <p class="sub">{{ email }}</p>

    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    {% if forced %}
      <div class="notice">Devam etmeden once parolanizi degistirmelisiniz.</div>
    {% endif %}

    <form method="post" action="/auth/change-password">
      <label for="current_password">Mevcut parola</label>
      <input id="current_password" name="current_password" type="password" required
             autocomplete="current-password" autofocus>
      <label for="new_password">Yeni parola</label>
      <input id="new_password" name="new_password" type="password" required
             autocomplete="new-password">
      <label for="confirm_password">Yeni parola (tekrar)</label>
      <input id="confirm_password" name="confirm_password" type="password" required
             autocomplete="new-password">
      <p class="rules">En az 10 karakter; buyuk harf, kucuk harf ve rakam icermeli.</p>
      <button type="submit">Kaydet</button>
    </form>

    <p class="foot"><a href="/logout">Cikis yap</a></p>
  </div>
</body>
</html>
