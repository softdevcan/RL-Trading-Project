  sade: >-
    Borsaya yeni giren bir hissede ilk haftalarda işlem yapılmaması kuralı.
  teknik: >-
    LISTING_LOCKOUT = 20 seans; ortam ve canlı karar aynı işlem yapılabilirlik maskesini kullanır.
  kodda: [marl/accounting.py::LISTING_LOCKOUT]
  ilgili: [panel, satis-engeli]

- id: satis-engeli
  terim: Satış engeli (taban açılış)
  kategori: veri
  sade: >-
    Bir hisse güne en düşük fiyat sınırından (taban) açılırsa o gün satılamayacağını varsayan kural.
  teknik: >-
    limit_down_gaps(dates): dönem bağımlı fiyat marjı − 0,005. Marj takvimi 2020-12-31'e kadar doğrulandı; sonrası için
    hata verir (önce kaynakla doğrulanmalı). Tavan alım engeli yoktur.
  kodda: [marl/accounting.py::limit_down_gaps]
  belgede: [docs/development/phase-10-m2-design.md]
  ilgili: [listeleme-kilidi, panel]

- id: nokta-zamanlilik
  terim: Nokta-zamanlılık (B0)
  kategori: veri
  sade: >-
    Geçmişteki bir gün için yalnız o gün gerçekten bilinebilecek veriyi kullanmak.
  teknik: >-
    B0 kesme değişmezliği: t'den sonraki veri bozulduğunda t'deki özellik ya da tahmin değişmemelidir; testlerde mutasyonla
    denetlenir. Bilinen metodolojik açıklar roadmap'te listelidir.
  belgede: [docs/development/roadmap.md]
  ilgili: [pit-tablosu, pencereler]
  uyari: >-
    "Sızıntı yok" denmez; doğrulanmış sızıntı kaynakları var (roadmap "Bilinen Metodolojik Açıklar").

- id: ohlcv
  terim: OHLCV
  kisaltma: OHLCV
  kategori: veri
  sade: >-
    Bir hissenin bir gündeki açılış, en yüksek, en düşük ve kapanış fiyatı ile işlem hacmi.
  teknik: >-
    Open, High, Low, Close, Volume; yfinance'ten düzeltilmiş (auto_adjust) olarak çekilir. MARL ortamı açılışta yürütür
    (K12), değerlemeyi kapanışla yapar.
  kodda: [data/data_fetcher.py::DataFetcher]
  ilgili: [yfinance, duzeltilmis-fiyat, k12, panel]

- id: yfinance
  terim: yfinance
  kategori: veri
  sade: >-
    Hisse fiyatlarının ve bazı küresel göstergelerin indirildiği açık veri kaynağı.
  teknik: >-
    DataFetcher.fetch_stock_data (yeniden deneme, önbellek, %80 kapsam denetimi) ve fetch_incremental (yalnız eksik günler).
    Seans kapanmadan dönen OHLC'si boş taslak satır yalnız yeni veride süzülür; diske yazılırsa o seans bir daha çekilmez.
  kodda: [data/data_fetcher.py::DataFetcher, data/data_fetcher.py::fetch_incremental]
  belgede: [app/CLAUDE.md]
  ilgili: [ohlcv, duzeltilmis-fiyat, kuresel-makro]

- id: duzeltilmis-fiyat
  terim: Düzeltilmiş fiyat
  kategori: veri
  sade: >-
    Temettü ve bölünmelerin etkisi geçmişe yansıtılmış fiyat. Yeni bir temettü geldiğinde geçmiş fiyatların hepsi yeniden ölçeklenebilir.
  teknik: >-
    yfinance auto_adjust. Tam yeniden indirme geçmişi değiştirir; bir sonucu yeniden üretirken veri yeniden indirilmez, panel
    SHA-256'sı ve anlık görüntüyle çalışılır. Düzeltilmiş fiyatla lot ya da fiyat seviyesi iddiası kurulmaz.
  belgede: [env/CLAUDE.md]
  ilgili: [ohlcv, yfinance, panel]

- id: teknik-gostergeler
  terim: Teknik göstergeler (MACD, RSI, CCI, ADX)
  kategori: veri
  sade: >-
    Fiyat geçmişinden hesaplanan, eğilim ve momentum özetleyen sayılar. Ajanın gözleminde fiyatın yanında yer alır.
  teknik: >-
    macd (+ sinyal, histogram), rsi, cci, adx ve turbulence. Isınma satırları: eski hat bfill ile doldurur, RL veri kapısı
    bfill imzalı baş bloğu atar (B7). ADX için ayrı terime bakın.
  kodda: [data/technical_indicators.py, data/integrity.py::INDICATOR_COLS]
  ilgili: [adx, turbulans, gozlem, veri-kapisi]

- id: adx
  terim: ADX (Wilder)
  kisaltma: ADX
  kategori: veri
  sade: >-
    Bir eğilimin ne kadar güçlü olduğunu ölçen teknik gösterge.
  teknik: >-
    Kayıtlı CSV'deki ADX eski hesabın sabit 0'ıdır (indeks hizalama hatası; eski modeller böyle eğitildi). Rota ve MARL
    paneli ADX'i with_adx(df, 'wilder') ile yeniden hesaplar ve meta'ya indicator_spec yazar; eski ADX build_arrays'te
    reddedilir (K18).
  kodda: [data/technical_indicators.py::with_adx, marl/panel.py::build_arrays]
  ilgili: [teknik-gostergeler, model-meta]

- id: veri-kapisi
  terim: RL veri kapısı
  kategori: veri
  sade: >-
    Fiyat verisi ajana gitmeden önce bozuk satırları yakalayan ve öğrenme penceresini sabitleyen denetim.
  teknik: >-
    prepare_rl_panel: pencere RL_DATA_START = 2013-06-01 (K17); pencere içinde fiyat artefaktı varsa DataIntegrityError
    (sessizce temizlenmez); hayalet gün ve bayat hücre atılır, hücre eksik sayılır; gösterge ısınması atılır.
