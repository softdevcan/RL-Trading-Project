# Sistem sözlüğü — TEK KAYNAK (K28 R1; plan docs/development/system-guide-plan.md §3).
# Elle yazılır. docs/sozluk.md bu dosyadan `python scripts/build_guide.py` ile ÜRETİLİR; onu elle düzenleme.
# Kurallar (§3): sade en fazla 2 cümle, kısaltma kullanıyorsa o terim `ilgili`'de; teknik tanım koddaki tanımla aynı,
# `kodda` o tanımın yeri; sözlükte deney SONUCU (etiket, ölçülen sayı) yok, yalnız tanım ve tasarım parametresi;
# kaynak yalnız docs/thesis/literature-table.md'de geçen "Yazar (yıl)" dizesiyle. Denetim: tests/test_guide.py.

# ------------------------------------------------------------------ sistem ve aşamalar
- id: faz
  terim: Faz
  kategori: sistem
  sade: >-
    Projenin büyük geliştirme aşamaları. Her faz bir iş paketini (örneğin tahmin sistemi, kimlik, arayüz, araştırma geçerliliği) tamamlar.
  teknik: >-
    Tamamlananlar: Faz 1 (kavram kanıtı), 2 (tahmin sistemi), 3 (üretim iyileştirmeleri), 6 (performans), 7 (kimlik ve
    çok kullanıcı), 8 (arayüz), 9 (araştırma geçerliliği). Faz 10 (çok ajanlı öğrenme) sürüyor. Bileşen ve aşama durumu
    sistem haritasında tutulur.
  belgede: [docs/development/system-map.md, docs/README.md]
  ilgili: [m-asamalari, milestone-0p]

- id: milestone-0p
  terim: Milestone 0'
  kategori: sistem
  sade: >-
    Tek ajanlı modellerin, önceden dondurulmuş bir protokolle yeniden koşulduğu kıyas aşaması. Sonradan kural değiştirilemez.
  teknik: >-
    Protokol m0p-v2 dondurulmuş (git etiketi m0-protocol-v2); koşumlar scripts/run_milestone0.py, analiz
    scripts/analyze_milestone0.py. Protokol JSON'u ve belgesi değiştirilmez; değişiklik yeni sürüm (m0p-v3) ister.
  kodda: [scripts/run_milestone0.py, scripts/analyze_milestone0.py]
  belgede: [docs/development/milestone0-protocol-v2.md]
  ilgili: [on-kayit, faz]

- id: m-asamalari
  terim: M1–M8 (Faz 10 aşamaları)
  kategori: sistem
  sade: >-
    Çok ajanlı sistemin adım adım kurulduğu aşamalar. Her aşama bir öncekinin üstüne bir parça ekler ve kendi denetimiyle kapanır.
  teknik: >-
    M1 çerçeve denemesi (BenchMARL/TorchRL), M2 ortam ve muhasebe çekirdeği, M3 öğrenme ve pozitif kontrol, M4 iletişim
    kolları, M5 tahmin sinyali ve güvenle ağırlıklı iletişim. M6–M8 Faz 10 planında tanımlı sonraki aşamalardır; uzun
    koşular M8'den önce yapılır.
  belgede: [docs/development/phase-10-marl-plan.md]
  ilgili: [m3, m4, m5, gelistirme-kapisi]

- id: m3
  terim: M3a / M3b
  kategori: sistem
  sade: >-
    Çok ajanlı sistemin, cevabı bilerek konmuş sahte bir ipucunu kullanmayı öğrenip öğrenemediğinin sınandığı aşama. M3a maliyetsiz, M3b işlem maliyetli koşulur.
  teknik: >-
    M3a: A1 (pozitif kontrol bloğu gözlemde) ↔ S1 (aynı bloğun karıştırılmış hâli), maliyetsiz, ön kayıtlı eşiklerle.
    M3b: aynı karşılaştırma 20 bps gidiş-dönüş maliyetle (A1c ↔ S1c).
  belgede: [docs/development/phase-10-m3-design.md]
  ilgili: [pozitif-kontrol, karistirilmis-kontrol, kol-kodlari-m3, islem-maliyeti, gelistirme-kapisi]

- id: m4
  terim: M4a / M4b
  kategori: sistem
  sade: >-
    İletişimin, bir ajanın elindeki bilgiyi ihtiyacı olan komşusuna taşıyıp taşımadığının sınandığı aşama.
  teknik: >-
    Komşu sinyali düzeninde. M4a: iletişimsiz (none), tam bağlı dikkat (attn) ve graf maskeli dikkat (gat) kolları.
    M4b: gat ↔ mimari-eş iletişimsiz kol (self) pilotu. İkisi de geliştirme kapısıdır.
  kodda: [marl/comm_models.py::CommPolicy]
  belgede: [docs/development/phase-10-m4-design.md]
  ilgili: [komsu-sinyali, iletisim-kollari, kol-kodlari-m4, gelistirme-kapisi]

- id: m5
  terim: M5
  kategori: sistem
  sade: >-
    Tahmin sinyalinin ajanlara gözlem ya da mesaj olarak verilmesinin ve mesajları tahminin güvenine göre ağırlıklandırmanın neyi değiştirdiğinin sınandığı aşama.
  teknik: >-
    Gerçek sinyal kolları (S-obs, S-msg, ikisi birden) sağlamlık sorusunu sınar. Güven mekanizması (güvenle ağırlıklı
    dikkat, karşılaştırılabilir güven) yalnız sentetik pozitif kontrolde, komşu sinyali düzeninde sınanır. Okuma kuralı
    sonuçtan önce yazılır.
  kodda: [marl/comm_models.py::confidence_term]
  belgede: [docs/development/phase-10-m5-design.md]
  ilgili: [s-obs, s-msg, beta, kol-kodlari-m5, pozitif-kontrol, komsu-sinyali]

- id: k-kararlari
  terim: K-kararları
  kategori: sistem
  sade: >-
    Plan belgelerinde numaralanmış ve kullanıcının onayladığı tasarım kararları.
  teknik: >-
    Faz 9 ve Faz 10 planlarının karar tablolarında "K" ve bir sayıyla anılır (Faz 10 §6; ör. K12 yürütme ufku, K24
    parametre paylaşımı). Aynı numara farklı tablolarda farklı bir karar olabilir; hangi tablo olduğu bağlamdan okunur.
  belgede: [docs/development/phase-10-marl-plan.md, docs/development/phase-9-research-validity-plan.md]
  ilgili: [k12, parametre-paylasimi]

- id: k12
  terim: K12 yürütme ufku
  kisaltma: K12
  kategori: sistem
  sade: >-
    Akşam kapanışta karar ver, ertesi sabah açılışta işlem yap, pozisyonu bir sonraki sabaha kadar tut.
  teknik: >-
    Karar t kapanışında, yürütme t+1 açılışında; kararın kazandığı getiri Oₜ₊₁ → Oₜ₊₂. Pozitif kontrolün etiketi aynı
    ufukta: 1[Oₜ₊₂ > Oₜ₊₁]. Eski tek ajan ortamı değişmedi (orada karar ve yürütme aynı kapanışta).
  kodda: [scripts/marl/pc_alignment_m2.py::k12_labels]
  belgede: [docs/development/phase-10-marl-plan.md]
  ilgili: [k-kararlari, pozitif-kontrol]

- id: on-kayit
  terim: Ön kayıt
  kategori: sistem
  sade: >-
    Deneyi koşmadan önce neyin başarı sayılacağını ve sonucun nasıl okunacağını yazıp dondurmak. Sonuca bakıp kural değiştirmeyi önler.
  teknik: >-
    Kollar, tohumlar, eşikler ve okuma tablosu koşudan önce commit'lenir ve DONDURULDU diye işaretlenir. Sonradan her
    değişiklik yeni bir ön kayıt ister ve deneme sayısına eklenir. Yasak kurtarma yolları (ek tohum, eşik değişimi,
    birincil karşılaştırmanın değişmesi) ön kayıtta listelenir.
  belgede: [docs/development/phase-10-m5-design.md, docs/development/phase-10-m4-design.md]
  ilgili: [deneme-kaydi, hakem-paneli, tohum]

- id: hakem-paneli
  terim: Hakem paneli
  kategori: sistem
  sade: >-
    Bir deney ya da önemli bir kod değişikliği koşulmadan önce onu eleştirel gözle okuyan yapay zekâ hakemleri.
  teknik: >-
    hakem-finans ve hakem-rl dar kapsamlı uzmanlardır ve pahalı bir işin girdisinde çağrılır; hakem-2 faz kapanışında son
    kapıdır. Ana oturum ~5 bin token'lık bir inceleme paketi yazar ve uzun ölçümleri kendisi yapar; ikinci okuma yalnız
    BÜYÜK bulguda yapılır. Maliyet kaydı review-panel.md'de.
  belgede: [docs/development/review-panel.md]
  ilgili: [on-kayit]

- id: gelistirme-kapisi
  terim: Geliştirme kapısı
  kategori: sistem
  sade: >-
    Sistemin bir parçası beklendiği gibi çalışıyor mu diye bakılan ara denetim. Tezin bulgusu değildir.
  teknik: >-
    Faz 10 §3.2.5: gerçek sinyalli koşulardan önce sentetik bir pozitif kontrolle ve pilot büyüklükte (az tohum) koşulur.
    Sonuç bir sonraki aşamanın tasarımına girdi olur; uzun koşu sistem olgunlaşınca M8'den önce yapılır.
  belgede: [docs/development/phase-10-marl-plan.md]
  ilgili: [pozitif-kontrol, etiket-pilot, m-asamalari]

- id: deneme-kaydi
  terim: Deneme kaydı (N)
  kategori: sistem
  sade: >-
    Yapılan her deneyin, sonucu ne olursa olsun kaydedildiği defter. Çok deneme yapıp yalnız iyi çıkanı göstermeyi engeller.
  teknik: >-
    Deneme sayısı N, çoklu deneme düzeltmelerine (ör. Deflated Sharpe) girer. Ön kayıt hangi karşılaştırmaların deneme
    sayıldığını yazar; değerlendirme protokolünün açık maddeleri kayıtta etiketlenir.
  kodda: [evaluation/trial_registry.py]
  ilgili: [dsr, on-kayit]

- id: ansari-replikasyonu
  terim: Ansari replikasyonu
  kategori: sistem
  sade: >-
    Projenin başlangıç noktası: yayımlanmış bir tek ajanlı alım-satım çalışmasının BIST-30'a uyarlanmış kopyası. Eski ortam bu çalışmaya sadık tutulur.
  teknik: >-
    Ansari vd. (2024) metodolojisi; tek ajan ortamı ve gözlem tanımı (MACD, türbülans, hacim) bu çalışmanın tanımında
    kalır. Bilinen açıklar düzeltilmez, beyan edilir (K26 = a); yeni tasarım MARL ortamındadır.
  kodda: [env/trading_env.py::TradingEnv]
  belgede: [docs/thesis/vision-and-scope.md]
  ilgili: [tek-ajan-ortami, milestone-0p, faz-9-paketleri]
  kaynak: ["Ansari vd. (2024)"]

- id: faz-9-paketleri
  terim: Faz 9 paketleri (A–G, P, R)
  kategori: sistem
  sade: >-
    Araştırma geçerliliği aşamasında yapılan iş paketleri: istatistik, sızıntı kapatma, tekrar üretilebilirlik, baseline, evren, kalibrasyon, ödül tanımı ve tahmin tablosu gibi.
  teknik: >-
    A değerlendirme çekirdeği, B sızıntı kapatma, C tekrar üretilebilirlik, D baseline ve raporlama, E evren ve sektör, F
    tahmin güveni ve kalibrasyon, G ödül tanımı; P nokta-zamanlı tahmin tablosu, R1 tek bölme/panel/evren. Faz 9 kapandı
    (2026-11-15); durum planın §9 alt bölümlerinde.
  belgede: [docs/development/phase-9-research-validity-plan.md]
  ilgili: [faz, bilinen-aciklar, pit-tablosu]

- id: bilinen-aciklar
  terim: Bilinen açıklar (Y kodları)
  kategori: sistem
  sade: >-
    Kodda ya da yöntemde bulunmuş ve kayda geçmiş sorunların listesi. Bir açık kapanana kadar ilgili sonuçlar ön sonuç sayılır.
  teknik: >-
    Faz 9 planında Y ve bir sayıyla anılır (ör. Y13 test ölçeği, Y30 SHAP girdisi, Y31 altın kapanışı); roadmap'te "Bilinen
    Metodolojik Açıklar". Açık bir madde deneme kaydında protocol_open etiketine dönüşür.
  belgede: [docs/development/roadmap.md, docs/development/phase-9-research-validity-plan.md]
  ilgili: [protokol-acik, nokta-zamanlilik, faz-9-paketleri]

- id: protokol-acik
  terim: Protokol açık (protocol_open)
  kategori: sistem
  sade: >-
    Bilinen bir açıktan etkilenen deneme kaydına konan etiket. Bu etiketi taşıyan sonuçlar kanıt olarak kullanılmaz.
  teknik: >-
    Deneme kaydı protokol maddelerini ölçümle taşır (test ölçeği, gösterge bfill, ADX, obs_health, eval_window_unexposed,
    fundamentals_pit). Açık madde varsa kayıt PROTOCOL_OPEN_TAG alır ve load_trials onu varsayılan dışlar; yine de N'ye
    sayılır.
  kodda: [evaluation/trial_registry.py::PROTOCOL_OPEN_TAG, evaluation/trial_registry.py::EXPOSED_EVAL_WINDOWS]
  belgede: [evaluation/CLAUDE.md]
  ilgili: [deneme-kaydi, bilinen-aciklar, gozlem-sagligi]

- id: okuma-kurali
  terim: Okuma kuralı (okuma tablosu)
  kategori: sistem
  sade: >-
    Bir deneyin olası her sonucunun ne anlama geleceğini, koşudan önce yazan tablo. Sonuç görüldükten sonra değiştirilmez.
  teknik: >-
    Ön kaydın parçası; eşikler, test ve öncelik sırası okuma betiğinde (analyze_*.py) koddadır ve kendi kendini sınar
    (--self-test). Her okuma "yazılmayacak olan" ifadeyle birlikte verilir.
  kodda: [scripts/marl/analyze_m5.py]
  belgede: [docs/development/phase-10-m5-design.md]
  ilgili: [on-kayit, yasak-kurtarma, durma-kurali, okuma-o1-o4]

- id: durma-kurali
  terim: Durma kuralı
  kategori: sistem
  sade: >-
    Bir deney beklenen eşiği geçemezse sonraki adıma geçilmeyip kararın kullanıcıya bırakılmasını söyleyen kural.
  teknik: >-
    Ön kayıtta yazılıdır: hangi etikette sonraki aşamanın koşulacağı ya da koşulmayacağı önceden sabitlenir (M3b ve M4a
    aşama kuralları). Aynı kapı ek tohumla kurtarılmaz; yeni deney yeni ön kayıt ister.
  belgede: [docs/development/phase-10-m3-design.md, docs/development/phase-10-m4-design.md]
  ilgili: [on-kayit, gelistirme-kapisi, yasak-kurtarma]

- id: yasak-kurtarma
  terim: Yasak kurtarma yolları
  kategori: sistem
  sade: >-
    Bir sonuç beğenilmediğinde başvurulması yasaklanan değişiklikler: ek tohum, eşiği değiştirmek, iyi görünen alt kümeyi seçmek gibi.
  teknik: >-
    Ön kayıtta listelenir (M5 §2.5: hedef ufkunu değiştirmek, özellik kümesi, sembol alt kümesi, ek tohum, eşik/test/birincil
    karşılaştırma). Gerekirse yeni ön kayıt yazılır ve deneme sayısına eklenir.
  belgede: [docs/development/phase-10-m5-design.md]
  ilgili: [on-kayit, okuma-kurali, deneme-kaydi, durma-kurali]

- id: olcum-arsivi
  terim: Ölçüm arşivi
  kategori: sistem
  sade: >-
    Metne giren her sayının üretildiği JSON dosyalarının tutulduğu yer. Rakamlar metne elle kopyalanmaz, hangi dosyadan geldiği yazılır.
  teknik: >-
    docs/development/measurements/<aşama>/; her JSON betik SHA'sını, commit'i ve git_status'u taşır (kirli ağaç iz bırakır,
    bu yüzden ölçüm betiği commit'lenmeden koşulmaz). Rehber kartları sayılarını bu dosyalardan okur.
  kodda: [scripts/build_guide.py]
  belgede: [docs/development/review-panel.md]
  ilgili: [rehber-sayfasi, hakem-paneli, deneme-kaydi]

# ------------------------------------------------------------------ deney kodları ve etiketler
- id: pozitif-kontrol
  terim: Pozitif kontrol (PC060-K12)
  kisaltma: PC060-K12
  kategori: deney
  sade: >-
    Cevabı bilerek içine konmuş sahte bir ipucu. Sistemin gerçek bir ipucunu kullanabilip kullanamadığını sınamak içindir; gerçek bir tahmin değildir.
  benzetme: >-
    Sınavdan önce öğrenciye kopya kâğıdı verip kopyayı okuyabiliyor mu diye bakmak.
  teknik: >-
    Etiketten (geleceği bilerek) üretilmiş, hedef AUC'si 0,60 olan sentetik p_up_cal; taban tablonun maskesi ve ölçeği
    korunur. Etiket K12 ufkunda 1[Oₜ₊₂ > Oₜ₊₁]. Üreteç tohumu bloğu belirler. Yalnız boru hattı kontrolüdür.
  kodda: [prediction/pit_table.py::positive_control_table, scripts/marl/build_pred_m3.py]
  belgede: [docs/development/phase-10-m3-design.md]
  ilgili: [k12, auc, karistirilmis-kontrol]
  uyari: >-
    Bilerek gelecekten bilgi taşır; performans sonucu ya da tez bulgusu olarak raporlanmaz.

- id: karistirilmis-kontrol
  terim: Karıştırılmış kontrol
  kategori: deney
  sade: >-
    Aynı ipucunun günleri karıştırılmış hâli. Biçimi aynıdır ama doğru güne ait değildir, yani bilgi taşımaz.
  teknik: >-
    Tahmin bloğunun satırları (günler) üreteç tohumuyla permüte edilir; üç alan ve maske birlikte. Kesit yapısı ve
    marjinal dağılım korunur, zaman hizası kopar. İpucunun bilgisini girdi boyutundan ve kapasiteden ayırır.
  kodda: [scripts/marl/build_pred_m3.py]
  belgede: [docs/development/phase-10-m3-design.md]
  ilgili: [pozitif-kontrol, kol]

- id: komsu-sinyali
  terim: Komşu sinyali (σ)
  kisaltma: σ
  kategori: deney
  sade: >-
    Her ajanın elindeki ipucu kendi hissesine değil, bir komşu hisseye aittir. O bilgi ancak iletişimle ihtiyacı olan ajana ulaşır.
  teknik: >-
    σ, gat grafında sabit noktasız bir komşu eşlemesidir (iki parçalı eşleme, Hopcroft–Karp); ajan j'nin gözlemine
    σ(j)'nin pozitif kontrol bloğu konur. σ M4a'da donduruldu (neighbor_map.json) ve sonraki üretimler onu okur. Komşular
    korele olduğundan iletişimsiz politika da komşu sinyalinden kısmi değer alabilir; bu sızıntı koşudan önce ölçülür.
  kodda: [scripts/marl/build_pred_m4.py::neighbor_bijection]
  belgede: [docs/development/phase-10-m4-design.md]
  ilgili: [pozitif-kontrol, graf, iletisim-kollari]

- id: kol
  terim: Kol
  kategori: deney
  sade: >-
    Bir deneyde karşılaştırılan yapılandırmalardan her biri. İlaç denemesindeki "ilaç grubu" ve "plasebo grubu" gibi.
  teknik: >-
    Aynı bütçe, aynı tohumlar ve aynı değerlendirmeyle koşulan, yalnız sınanan öğede farklı yapılandırma. Kodlar aşamaya
    özgüdür (M3: A1/S1; M4: N/A/G/Z × X/S; M5: G0/GL/GLS/GLM/GD).
  ilgili: [kol-kodlari-m3, kol-kodlari-m4, kol-kodlari-m5, tohum]

- id: kol-kodlari-m3
  terim: A1 / S1 / A1c / S1c
  kategori: deney
  sade: >-
    M3'ün kolları: A1 sahte ipucuyla, S1 aynı ipucunun karıştırılmış hâliyle eğitilir. Sondaki "c" işlem maliyetli sürümü belirtir.
  teknik: >-
    A1: pozitif kontrol bloğu gözlemde; S1: karıştırılmış blok; A0: tahminsiz. "c" son eki 20 bps gidiş-dönüş maliyetli
    kol (M3b).
  belgede: [docs/development/phase-10-m3-design.md]
  ilgili: [m3, pozitif-kontrol, karistirilmis-kontrol, islem-maliyeti]

- id: kol-kodlari-m4
  terim: N / A / G / Z × X / S
  kategori: deney
  sade: >-
    M4'ün kolları: ilk harf iletişim türü (N yok, A herkesle, G yalnız komşularla, Z yalnız kendine), ikinci harf ipucu (X gerçek komşu ipucu, S karıştırılmış).
  teknik: >-
    N = none (BenchMARL MLP), A = attn, G = gat (graf maskeli dikkat), Z = self (aynı katmanlar, dikkat yalnız kendine:
    mimari-eş iletişimsiz kontrol). X = komşu sinyali bloğu, S = karıştırılmış komşu bloğu.
  kodda: [marl/comm_models.py::CommPolicy]
  belgede: [docs/development/phase-10-m4-design.md]
  ilgili: [m4, iletisim-kollari, komsu-sinyali, karistirilmis-kontrol]

- id: kol-kodlari-m5
  terim: G0 / GL / GLS / GLM / GD
  kategori: deney
  sade: >-
    M5 mekanizma kolları: G0 güvensiz, GL güvenle ağırlıklı, GLS güveni karıştırılmış, GLM güveni göndericiler arasında bozulmuş, GD sabit güven ölçeklemeli iletişim. Hepsi komşularla sınırlı iletişim kullanır.
  teknik: >-
    Hepsi gat + komşu sinyali. GL: zlogodds güven terimi, β öğrenilen (0'dan); GLS: güven terimi sabit bir derangement ile
    göndericiler arasında karıştırılmış; GLM: yalnız güven teriminde gönderici başına sıcaklık; GD: prob terimi, β = 1
    sabit (DebUnc ölçeklemesi).
  kodda: [marl/comm_models.py::confidence_term]
  belgede: [docs/development/phase-10-m5-design.md]
  ilgili: [m5, s-msg, beta, komsu-sinyali]

- id: etiket-gecti
  terim: GEÇTİ
  kategori: deney
  sade: >-
    Ön kayıttaki bütün koşullar sağlandı. Aşama bir sonrakine girdi verebilir.
  teknik: >-
    Ön kayıtlı kapının koşulları birlikte: etki yönü, tek yönlü p < 0,05, tohum sıralaması ve doğrulama penceresinde
    işaret. Geliştirme kapısı sonucudur, tez bulgusu değildir.
  ilgili: [on-kayit, gelistirme-kapisi, tek-yonlu-p]

- id: etiket-kismi
  terim: KISMİ
  kategori: deney
  sade: >-
    Birincil koşul sağlandı ama diğerlerinden en az biri sağlanmadı. Kaynağı belirsiz bir işaret.
  teknik: >-
    Birincil fark ve testi var; kontrol, sıralama ya da doğrulama koşullarından biri yok. Aynı kapı ek tohumla
    kurtarılmaz; yeni deney yeni ön kayıt ister.
  ilgili: [on-kayit, tohum]

- id: etiket-gozlenmedi
  terim: GÖZLENMEDİ
  kategori: deney
  sade: >-
    Beklenen fark bu deneyde görülmedi. "Etki yok" demek değildir; deney küçük olabilir.
  teknik: >-
    Birincil koşul (fark > 0 ve tek yönlü p < 0,05) sağlanmadı. Güç düşükse okunuşu "bu güçle tespit edilmedi"dir.
  ilgili: [guc, tek-yonlu-p]

- id: etiket-pilot
  terim: PİLOT_İŞARETİ
  kategori: deney
  sade: >-
    Küçük bir ön denemede beklenen yönde bir işaret görüldü. Karar vermek için değil, büyük deneyi tasarlamak içindir.
  teknik: >-
    Pilot ön kayıtlarında (M4b, M5) tüm koşullar sağlandığında verilen etiket; karar kapısı değil, işarettir. Uzun koşu
    ayrı bir ön kayıt ister.
  ilgili: [on-kayit, guc, tohum]

- id: tohum
  terim: Tohum
  kategori: deney
  sade: >-
    Rastgeleliğin başlangıç numarası; aynı tohumla aynı deney aynı sonucu verir. Farklı tohumlar, sonucun şansa ne kadar bağlı olduğunu gösterir.
  teknik: >-
    Ağırlık başlangıcı, veri toplama ve sentetik sinyal üretecinin tohumu. Yeni bir ön kayıt, sonucu görülmüş tohumları
    yeniden kullanmaz (seçim yanlılığı). CPU'da bit-eşlik için OMP_NUM_THREADS ve MKL_NUM_THREADS = 1, torch import
    edilmeden önce.
  kodda: [marl/benchmarl_task.py]
  ilgili: [guc, kol]

- id: gurultu-tabani
  terim: Gürültü tabanı
  kategori: deney
  sade: >-
    Bilgi açısından aynı olması gereken iki kol arasında, yalnız şans ve donanım yüzünden ortaya çıkan fark. Gerçek bir etkinin bu farktan büyük olması beklenir.
  teknik: >-
    M5 mekanizma kollarında |D(GD, G0)|; GL ↔ G0 farkının bunu aşması H2'nin (v) koşuludur. Ortak HAC p'si üç tohumda tohum
    varyansını taşımadığı için taban, testin kalibrasyonunu da denetler.
  kodda: [scripts/marl/analyze_m5.py]
  belgede: [docs/development/phase-10-m5-design.md]
  ilgili: [d-farki, hac, kol-kodlari-m5, karistirilmis-kontrol]

- id: okuma-o1-o4
  terim: Gerçek sinyal okumaları (O1–O4)
  kategori: deney
  sade: >-
    Gerçek tahmin sinyaliyle yapılan koşuların dört olası sonucunun önceden yazılmış yorumu: fark yok, bozuyor, girdi etkisi ya da keşifsel işaret.
  teknik: >-
    O1 gerçek ↔ karıştırılmış fark yok (MDE ile raporlanır); O2 gerçek sinyal karıştırılmıştan ya da tahminsizden kötü
    (sağlamlık uyarısı); O3 gerçek ≈ karıştırılmış, ikisi de tahminsizden farklı (girdi boyutu ya da kapasite); O4 gerçek >
    karıştırılmış, yalnız keşifsel ve ek koşullarla.
  belgede: [docs/development/phase-10-m5-design.md]
  ilgili: [okuma-kurali, karistirilmis-kontrol, mde, kesifsel]

- id: kesifsel
  terim: Keşifsel ve doğrulayıcı bulgu
  kategori: deney
  sade: >-
    Önceden yazılmış bir sınamadan geçen bulgu doğrulayıcı, sonuca bakarak fark edilen ama sınanmamış işaret keşifseldir. Keşifsel bir işaret tez bulgusu sayılmaz, yeni bir ön kayıtla sınanır.
  teknik: >-
    Geliştirme pilotları (M3–M5) keşifsel ya da geliştirme kapısıdır; doğrulayıcı sınama M8 ön kaydında ve dokunulmamış
    pencerede (m0p-v2 doğrulayıcı penceresi) yapılır. Rehber kartlarında "tez bulgusu değil" rozeti bu ayrımı gösterir.
  belgede: [docs/development/phase-10-marl-plan.md]
  ilgili: [on-kayit, gelistirme-kapisi, okuma-o1-o4, pencereler]

- id: kol-kodlari-m6
  terim: R0-N / SR-N
  kategori: deney
  sade: >-
    M6b pilotunun iki kolu: biri bugünkü gözlemle, öteki ayrıca bütün ajanlara aynı piyasa durumu bilgisini (eğilim ve oynaklık) vererek eğitilir. İkisi de iletişimsiz ve tahminsizdir.
  teknik: >-
    Tek etken S-reg yayın bloğu [z(sma_ratio), z(vol)]; maliyetsiz, F 600 bin, tohum 12–14; okuma BOZULMA / IYILESME_ISARETI /
    FARK_YOK (M6 tasarımı §6).
  kodda: [scripts/marl/run_m6sreg.py, scripts/marl/analyze_m6sreg.py]
  belgede: [docs/development/phase-10-m6-design.md]
  ilgili: [s-reg, kol, rejim]

- id: s-reg
  terim: S-reg (rejim yayın bloğu)
  kategori: marl
  sade: >-
    Bütün ajanlara aynı anda verilen piyasa durumu bilgisi: endeksin eğilimi ve oynaklığı. Her ajan kendi hissesine bakarken piyasanın genel havasını da görür.
  teknik: >-
    Gözleme eklenen paylaşılan ek özellikler (extras): birincil rejim etiketinin sürekli özellikleri z(sma_ratio), z(vol);
    as-of, ölçek yalnız eğitim satırlarından; eleştirmene de girer. Bayrak kapalıyken gözlem v1 ile bit-eş.
  kodda: [scripts/marl/build_sreg_m6.py]
  belgede: [docs/development/phase-10-m6-design.md]
  ilgili: [rejim, s-obs, gozlem]

- id: hmm-rejim
  terim: HMM rejimi (ikinci tanım)
  kategori: veri
  sade: >-
    Piyasanın sakin ya da çalkantılı döneminin, getirilerden istatistiksel olarak çıkarılan ikinci bir etiketi. Kural tabanlı etiketin tekrarı değil, daha çok oynaklık durumunu ölçer.
  teknik: >-
    Saklı Markov modeli (rejime göre değişen ortalama + varyans), USD bazlı XU100 günlük getiri; 63 seansta bir genişleyen
    yeniden uyum, yalnız filtrelenmiş olasılık; durum sayısı BIC ile (K = 3). İki hücre: en sakin durum ≥ 0,5 ↔ geri kalanlar
    (`calm_vs_rest`, K-M6-5).
  kodda: [evaluation/regimes_hmm.py::PRIMARY_TWO_CELL]
  belgede: [docs/development/phase-10-m6-design.md]
  ilgili: [rejim, nokta-zamanlilik]
  kaynak: ["Hamilton (1989)", "Nystrup vd. (2018)"]

- id: dikkat-testleri
  terim: Dikkat testleri (maskeleme, tek biçimli dikkat, karıştırılmış mesaj)
  kategori: marl
  sade: >-
    Ajanların mesajlara ne kadar ve nasıl dayandığını, eğitimden sonra mesajları kapatarak, eşit ağırlıkla ortalayarak ya da göndericiler arasında karıştırarak sınayan tanılar. Kararın nedensel açıklaması değildir.
  teknik: >-
    Yalnız değerlendirme: `set_sender_mask` (M7a; mesaj kapalı), `set_uniform_attention` (izinli göndericilere eşit ağırlık),
    `set_sender_permutation` (yuva j, π(j)'nin mesajını taşır; dağılım korunur), `set_attention_record`. Kapalıyken bit-eş.
  kodda: [marl/comm_models.py::CommPolicy, scripts/marl/mask_m7.py, scripts/marl/attn_m7b.py]
  belgede: [docs/development/phase-10-m6-design.md]
  ilgili: [dikkat, iletisim-kollari]
  kaynak: ["Wiegreffe & Pinter (2019)", "Jain & Wallace (2019)"]

- id: kol-kodlari-m5-gercek
  terim: T0-N / SO / SO-S / SO-S2 / T0-G / SB / SB-S / SB-S2
  kategori: deney
  sade: >-
    M5 gerçek sinyal kolları: SO gerçek tahmini gözleme ekler, SB gözleme ve güvenli mesaja ekler; -S ve -S2 sonekli kollar aynı sinyalin günleri karıştırılmış iki kopyasını, T0 kolları hiç tahmin görmeyen karşılıklarını kullanır. N iletişimsiz, G komşularla sınırlı iletişimli mimaridir.
  teknik: >-
    Sinyal pit_v2, komşu sinyali yok; karıştırma pencere içi (ısınma | eğitim | doğrulama), tohum s ve 1000 + s. SB = gat +
    GL (zlogodds, β öğrenilen). 20 bps, tohum 9–11. Birincil karşılaştırma gerçek ↔ karıştırılmış, tahminsiz karşılaştırmaları
    tabansız ikincildir.
  belgede: [docs/development/phase-10-m5-design.md]
  ilgili: [m5, s-obs, s-msg, karistirilmis-kontrol, siralama-tabani, okuma-o1-o4]

- id: siralama-tabani
  terim: Sıralama tabanı
  kategori: deney
  sade: >-
    Gerçek sinyalli kolun her tohumda iki karıştırılmış kolun ikisinin de üstünde (ya da altında) kalması koşulu. Sinyal bilgisizse bunun şansla olma olasılığı küçüktür.
  teknik: >-
    Aynı mimari ve tohumda gerçek, karıştırılmış ve ikinci karıştırma bilgi yokken değiştirilebilir sayılırsa, gerçeğin bir
    tohumda en üstte olma olasılığı 1/3; k = 3'te yön başına (1/3)³, iki yönlü yaklaşık 2/27. Bu bir alt sınırdır: gerçek
    blok tohumlar arasında ortaktır. Holm p ve doğrulama koşuluyla birlikte okunur.
  kodda: [scripts/marl/analyze_m5real.py]
  belgede: [docs/development/phase-10-m5-design.md]
  ilgili: [kol-kodlari-m5-gercek, gurultu-tabani, karistirilmis-kontrol, tohum]

# ------------------------------------------------------------------ değerlendirme ve istatistik
- id: sharpe
  terim: Sharpe oranı
  kisaltma: SR
  kategori: degerlendirme
  sade: >-
    Alınan her birim risk için ne kadar kazanıldığı. Yüksek olması, aynı dalgalanmayla daha çok kazanmak demektir.
  teknik: >-
    Fazla getirinin (X = R − rf) günlük ortalaması / standart sapması (ddof 1), √252 ile yıllıklandırılmış.
  kodda: [scripts/marl/analyze_m3.py::sr]
  ilgili: [fazla-getiri, d-farki, risksiz-faiz]
  kaynak: ["Sharpe (1966)"]

- id: fazla-getiri
  terim: Fazla getiri
  kategori: degerlendirme
  sade: >-
    Portföyün getirisinin, para risksiz faizde dursaydı kazanacağının üstündeki kısmı.
  teknik: >-
    X = R − rf, R = g₁(1 − c·τ)g₂ − 1 (gece kayması, maliyet, seans içi). Ödül ve seçim metriği aynı seriyi kullanır.
  kodda: [marl/accounting.py::step_fractional]
  ilgili: [risksiz-faiz, islem-maliyeti, devir, odul]

- id: risksiz-faiz
  terim: Risksiz faiz (A8)
  kategori: degerlendirme
  sade: >-
    Parayı hiç risk almadan tutsaydık kazanacağımız faiz. Bir stratejinin gerçekten değer katıp katmadığı bunun üstünden ölçülür.
  teknik: >-
    Tek kaynak: TCMB ağırlıklı ortalama fonlama maliyeti (EVDS'ten data/macro/risk_free.csv), seans başına dönem başı
    getiriye çevrilir. Seri yoksa hata verir; 0 ya da sabit bir değere sessizce düşülmez.
  kodda: [evaluation/risk_free.py::risk_free_series, marl/panel.py::risk_free_for]
  ilgili: [fazla-getiri, sharpe]

- id: d-farki
  terim: D (Sharpe farkı)
  kisaltma: D
  kategori: degerlendirme
  sade: >-
    İki kolun Sharpe oranları arasındaki farkın tohumlar üzerinden ortalaması. Pozitifse ilk kol daha iyidir.
  teknik: >-
    D = (1/K) Σₖ [SR(aₖ) − SR(bₖ)], eşli tohumlar ve aynı tarihler; standart hatası ortak HAC ile, yıllık. Eşleşme ve
    tarih uyumu okuma betiğinde denetlenir.
  kodda: [evaluation/sharpe_tests.py::sharpe_diff_hac_pooled]
  ilgili: [sharpe, hac, tohum, kol]

- id: hac
  terim: Ortak HAC
  kisaltma: HAC
  kategori: degerlendirme
  sade: >-
    Günlük getirilerin birbirine bağımlı olmasını hesaba katan bir belirsizlik (standart hata) hesabı.
  teknik: >-
    Heteroskedasticity and autocorrelation consistent: her çiftin Ledoit–Wolf Sharpe farkı serileri birlikte (ortak) bir
    HAC kovaryansıyla; D'nin etki fonksiyonunun HAC varyansı. K = 1'de tek çift testiyle aynı sonucu verir.
  kodda: [evaluation/sharpe_tests.py::sharpe_diff_hac_pooled]
  ilgili: [d-farki, tek-yonlu-p]
  kaynak: ["Newey & West (1987)", "Ledoit & Wolf (2008)"]
  uyari: >-
    p değeri piyasa günü gürültüsünü taşır, eğitim tohumları arasındaki değişkenliği taşımaz.

- id: tek-yonlu-p
  terim: Tek yönlü p
  kategori: degerlendirme
  sade: >-
    Gerçekte fark yokken, yalnız şansla en az bu kadar olumlu bir fark görme olasılığı. Küçükse sonucu şansa bağlamak zorlaşır.
  teknik: >-
    H0: D ≤ 0'a karşı tek taraflı; iki taraflı p'den D > 0 ise p/2, değilse 1 − p/2. Ön kayıtlarda eşik 0,05.
  kodda: [scripts/marl/analyze_m3.py::pooled]
  ilgili: [d-farki, holm, guc]

- id: holm
  terim: Holm düzeltmesi
  kategori: degerlendirme
  sade: >-
    Birden çok karşılaştırma yapınca şansla "bir şey bulma" riskini sınırlayan düzeltme.
  teknik: >-
    Holm–Bonferroni: p'ler küçükten büyüğe sıralanır, r'inci (0 tabanlı) p (m − r) ile çarpılır, kümülatif en büyük
    alınır ve 1'de kırpılır; aile hata oranını korur. Sabit sıralı testlerde (önce birincil, sonra ikincil) gerekmez.
  kodda: [scripts/marl/analyze_m3b.py::holm]
  ilgili: [tek-yonlu-p, bh-fdr]

- id: bh-fdr
  terim: Benjamini–Hochberg (BH-FDR)
  kisaltma: BH
  kategori: degerlendirme
  sade: >-
    Çok sayıda test yapınca "bulduklarımın ne kadarı yanlış alarm" oranını sınırlayan yöntem.
  teknik: >-
    Yanlış keşif oranını (FDR) q düzeyinde tutan adım-yukarı yöntem. Tahmin bilgi kapısında 30 sembol tek aile.
  kodda: [evaluation/multiple_testing.py::benjamini_hochberg]
  ilgili: [bilgi-kapisi, holm]
  kaynak: ["Benjamini & Hochberg (1995)"]

- id: guc
  terim: Güç
  kategori: degerlendirme
  sade: >-
    Gerçekten bir fark varsa deneyin onu yakalama olasılığı. Az tohumlu küçük deneylerin gücü düşüktür.
  teknik: >-
    Tip II hata olasılığının tümleyeni. Ön kayıtlarda tek yönlü %5 ve %80 güç için gereken tohum sayısı betimsel verilir:
    k = 3·((1,645 + 0,842)·SE / etki)²; SE'nin tohumla 1/√k küçüldüğü varsayımı iyimserdir.
  kodda: [scripts/marl/analyze_m4b.py::seeds_needed]
  ilgili: [mde, tohum, etiket-gozlenmedi]

- id: mde
  terim: En küçük tespit edilebilir etki (MDE)
  kisaltma: MDE
  kategori: degerlendirme
  sade: >-
    Bu deneyin güvenle yakalayabileceği en küçük etki. Bundan küçük bir etki varsa bile görülmeyebilir.
  teknik: >-
    Bilgi kapısında AUC için 0,5 + (z₁₋α + z_güç)·SE_boot; tek test için α, aile için α/m (BH'de ilk reddin Bonferroni
    sınırı).
  kodda: [prediction/pit_table.py::evaluate_gate]
  ilgili: [guc, auc, bilgi-kapisi]

- id: guven-araligi
  terim: Güven aralığı (GA)
  kisaltma: GA
  kategori: degerlendirme
  sade: >-
    Gerçek değerin büyük olasılıkla içinde olduğu aralık. Dar olması tahminin kesin olduğunu gösterir.
  teknik: >-
    %95 GA: tahmin ± 1,96·SE (normal yaklaşım) ya da blok bootstrap yüzdelikleri (bilgi kapısı, havuzlu AUC).
  ilgili: [hac, guc]

- id: pencereler
  terim: Eğitim / doğrulama / test penceresi
  kategori: degerlendirme
  sade: >-
    Verinin üç dilimi: model eğitimde öğrenir, doğrulamada kontrol edilir. Son dilime (2021 ve sonrası) geliştirme sırasında bakılmaz.
  teknik: >-
    MARL: eğitim 2013-06 .. 2018-12-31, doğrulama 2019–2020; 2021+ m0p-v2 doğrulayıcı penceresidir ve M2–M5
    geliştirmesinde başarımla okunmaz. Değerlendirme deterministik ve tam penceredir; normalizasyon yalnız eğitim
    satırlarından.
  kodda: [scripts/marl/train_m3.py::TRAIN_END]
  ilgili: [nokta-zamanlilik, milestone-0p]

- id: baseline-1n
  terim: 1/N (eşit ağırlık)
  kategori: degerlendirme
  sade: >-
    Parayı bütün hisselere eşit bölen en basit strateji. Her modelin en azından bunu geçmesi beklenir.
  teknik: >-
    MARL kıyasında her gün, tek ajan kıyasında aylık olarak geçerli sembollere eşit ağırlık; ortamın aynı muhasebesi,
    fiyat dolgusu, projeksiyonu ve maliyetiyle.
  kodda: [marl/m3_runner.py::rule_series, evaluation/baselines.py::equal_weight]
  ilgili: [al-tut, islem-maliyeti]

- id: al-tut
  terim: Al-tut
  kategori: degerlendirme
  sade: >-
    İlk gün parayı eşit bölüp sonra hiç işlem yapmamak.
  teknik: >-
    İlk gün 1/N, sonra hedef = kaymış ağırlık (işlem yok; yalnız zorunlu dondurma), ortamın muhasebesiyle.
  kodda: [marl/m3_runner.py::rule_series]
  ilgili: [baseline-1n]

- id: devir
  terim: Devir
  kategori: degerlendirme
  sade: >-
    Bir günde portföyün ne kadarının alınıp satıldığı. Yüksek devir, yüksek işlem maliyeti demektir.
  teknik: >-
    τ = Σᵢ |w*ᵢ − w̃ᵢ|, yalnız hisseler (nakit devre girmez); w* hedef, w̃ gece kaymış ağırlık. Maliyet bir kez sayılır.
  kodda: [marl/accounting.py::step_fractional]
  ilgili: [islem-maliyeti, fazla-getiri]

- id: islem-maliyeti
  terim: İşlem maliyeti (bps)
  kategori: degerlendirme
  sade: >-
    Her alım-satımda ödenen komisyon ve fiyat kayması. Baz puanla (bps, on binde bir) ölçülür.
  teknik: >-
    Gidiş-dönüş bps verilir; tek yön c = bps / 2 / 10⁴ (evaluation/baselines.py D4 ile aynı) ve devire uygulanır.
    Mekanizma kolları maliyetsiz, gerçek sinyal kolları 20 bps ile koşulur.
  kodda: [marl/accounting.py::one_way_cost]
  ilgili: [devir, fazla-getiri]

- id: dsr
  terim: Deflated Sharpe (DSR)
  kisaltma: DSR
  kategori: degerlendirme
  sade: >-
    Çok sayıda deneme yapıldığında en iyi Sharpe oranının şansla ne kadar şişebileceğini düzelten ölçü.
  teknik: >-
    Deneme sayısı, getirinin çarpıklığı ve basıklığıyla düzeltilmiş Sharpe olasılığı.
  kodda: [evaluation/sharpe.py::deflated_sharpe_ratio]
  ilgili: [sharpe, deneme-kaydi]
  kaynak: ["Bailey & López de Prado (2014)"]
  uyari: >-
    Eski uygulama yanlıştı ve düzeltildi; eski raporlarda eski fonksiyonla verilmiş bir DSR varsa yeniden hesaplanmalıdır.

- id: pbo
  terim: Aşırı uyum olasılığı (PBO)
  kisaltma: PBO
  kategori: degerlendirme
  sade: >-
    Geçmiş veride en iyi görünen yapılandırmanın, yeni veride ortalamanın altında kalma olasılığı. Yüksekse seçim şansa dayanıyor demektir.
  teknik: >-
    Kombinatoryal simetrik çapraz doğrulama (CSCV): (T, N) getiri matrisi S = 16 bloğa bölünür, C(16, 8) birleşimde örneklem
    içi en iyinin örneklem dışı sırası; PBO ve λ dağılımı.
  kodda: [evaluation/overfitting.py::probability_of_backtest_overfitting]
  ilgili: [dsr, mcs, deneme-kaydi]
  kaynak: ["Bailey vd. (2017)"]

- id: mcs
  terim: Model güven kümesi (MCS)
  kisaltma: MCS
  kategori: degerlendirme
  sade: >-
    Çok sayıda model arasından, istatistiksel olarak "en iyiden ayırt edilemeyen" modellerin kümesi. Tek bir kazanan yerine güvenilir bir küme verir.
  teknik: >-
    Hansen–Lunde–Nason; kayıp matrisi, durağan bootstrap (reps 2000), T_R istatistiği, varsayılan düzey %10.
  kodda: [evaluation/model_sets.py::model_confidence_set]
  ilgili: [pbo, blok-bootstrap]
  kaynak: ["Hansen vd. (2011)"]

- id: lw-bootstrap
  terim: Ledoit–Wolf Sharpe farkı testi
  kategori: degerlendirme
  sade: >-
    İki stratejinin Sharpe oranlarının gerçekten farklı olup olmadığını, getirilerin birbirine bağımlılığını hesaba katarak sınayan test.
  teknik: >-
    Sharpe farkının delta yöntemiyle HAC standart hatası (ön beyazlatmalı, QS çekirdeği, Andrews bant genişliği) ve
    studentize dairesel blok bootstrap sürümü (H0: SR1 = SR2, iki yönlü). Çok tohumlu okumada ortak (havuzlu) sürüm kullanılır.
  kodda: [evaluation/sharpe_tests.py::sharpe_diff_hac, evaluation/sharpe_tests.py::sharpe_diff_bootstrap]
  ilgili: [hac, sharpe, d-farki, blok-bootstrap]
  kaynak: ["Ledoit & Wolf (2008)"]

- id: blok-bootstrap
  terim: Blok bootstrap
  kategori: degerlendirme
  sade: >-
    Zaman serisini tek tek gün yerine ardışık bloklar halinde yeniden örnekleyerek belirsizliği ölçme yöntemi. Günler arası bağımlılık böylece korunur.
  teknik: >-
    Durağan bootstrap (rastgele blok uzunluğu, optimal_block_length) ortalama farkı için; bilgi kapısında 20 günlük tarih
    blokları. Güven aralığı ve tek yönlü p yüzdeliklerden.
  kodda: [evaluation/paired_tests.py::mean_diff_bootstrap, evaluation/calibration.py::block_bootstrap_ci]
  ilgili: [guven-araligi, bilgi-kapisi, mcs]
  kaynak: ["Politis & Romano (1994)"]

- id: diebold-mariano
  terim: Diebold–Mariano testi
  kisaltma: DM
  kategori: degerlendirme
  sade: >-
    İki tahmin modelinden hangisinin daha küçük hata yaptığını sınayan test.
  teknik: >-
    Kayıp farkının HAC (Newey–West, h − 1 gecikme) varyansı, Harvey–Leybourne–Newbold küçük örneklem düzeltmesi ve t
    dağılımı. prediction/evaluator.py'deki eski DM buraya yönlendirildi.
  kodda: [evaluation/forecast_tests.py::diebold_mariano]
  ilgili: [hac, tahmin-ensemble]
  kaynak: ["Diebold & Mariano (1995)"]

- id: sortino-calmar
  terim: Sortino ve Calmar oranları
  kategori: degerlendirme
  sade: >-
    Sharpe'a benzer iki risk ayarlı getiri ölçüsü: Sortino yalnız aşağı yönlü dalgalanmayı, Calmar en büyük düşüşü risk sayar.
  teknik: >-
    compute_sortino_ratio (aşağı yönlü sapma), compute_calmar_ratio (yıllık getiri / maksimum düşüş). Tahmin değerlendiricisinde
    betimsel; tez çıkarımı Sharpe ve fazla getiri üstünden yapılır.
  kodda: [prediction/evaluator.py]
  ilgili: [sharpe, fazla-getiri]
  kaynak: ["Sortino & Price (1994)"]

- id: getiri-birimi
  terim: Getiri birimi (nominal / reel / USD)
  kategori: degerlendirme
  sade: >-
    Getirinin hangi parayla ölçüldüğü: Türk lirası, enflasyondan arındırılmış lira ya da dolar. Yüksek enflasyonda bu seçim sonucu çok değiştirir.
  teknik: >-
    Birincil Sharpe nominal TL, risksiz faiz (A8) üstü fazla getiri. Reel (TÜFE basamağı) ve USD (USDTRY_{t−1}) birimleri
    sharpe_rf0 ile; TÜFE düzeyi yalnız ex post raporlama birimidir, karar girdisi değildir.
  kodda: [evaluation/units.py::convert_values, evaluation/units.py::fx_before]
  ilgili: [fazla-getiri, risksiz-faiz, makro-veri]

- id: tohum-gereksinimi
  terim: Tohum gereksinimi
  kategori: degerlendirme
  sade: >-
    Gözlenen bir farkın güvenle ayırt edilebilmesi için kaç tohumla koşmak gerektiğinin kaba tahmini. Uzun koşuların boyutu buna göre planlanır.
  teknik: >-
    seeds_needed(effect, se, k_now) = ⌈k_now · ((z₀,₉₅ + z₀,₈₀) · SE / etki)²⌉: standart hatanın √k ile küçüldüğü
    varsayımıyla, tek yönlü %5 düzeyde %80 güç için gereken tohum sayısı. Betimseldir; ön kayıttaki tohum sayısını sonradan
    değiştirmez.
  kodda: [scripts/marl/analyze_m4b.py::seeds_needed]
  ilgili: [tohum, guc, guven-araligi, mde]

- id: tohum-ozetleri
  terim: Tohumlar arası özet (IQM, iyileşme olasılığı)
  kategori: degerlendirme
  sade: >-
    Birden fazla tohumla koşulan bir kolun sonucunu, tek bir şanslı tohuma kanmadan özetleme yolları.
  teknik: >-
    aggregate_with_ci (rliable): medyan, IQM (çeyrekler arası ortalama), ortalama, optimality gap ve katmanlı bootstrap GA;
    probability_of_improvement: rastgele bir tohumda bir kolun diğerini geçme olasılığı.
  kodda: [evaluation/seed_stats.py::aggregate_with_ci, evaluation/seed_stats.py::probability_of_improvement]
  ilgili: [tohum, guven-araligi]

# ------------------------------------------------------------------ çok ajanlı öğrenme
- id: marl
  terim: Çok ajanlı pekiştirmeli öğrenme (MARL)
  kisaltma: MARL
  kategori: marl
  sade: >-
    Birden çok karar vericinin (ajanın) aynı ortamda deneme-yanılmayla birlikte öğrenmesi.
  teknik: >-
    Faz 10: hisse başına bir ajan (30 ajan, K6 seçenek A), ortak portföy. PettingZoo ortamı marl/env.py; eğitim
    BenchMARL/TorchRL ile ayrı sanal ortamda (venv-marl, K9).
  kodda: [marl/env.py, marl/benchmarl_task.py]
  belgede: [docs/development/phase-10-m2-design.md]
  ilgili: [ajan, mappo, ctde]

- id: ajan
  terim: Ajan
  kategori: marl
  sade: >-
    Kendi gözlemine bakıp karar veren, öğrenen program. Burada her hisseye bir ajan düşer.
  teknik: >-
    Ajan i hisse i için bir logit üretir; logitler hedef ağırlığa softmax([0, kırp(z, −B, B)]) ile çevrilir (0 = nakit).
    Politika parametreleri ajanlar arasında paylaşılır; ajan kimliği gözlemde one-hot.
  kodda: [marl/weights.py::target_weights]
  ilgili: [parametre-paylasimi, logit-siniri, politika, gozlem]

- id: mappo
  terim: MAPPO
  kisaltma: MAPPO
  kategori: marl
  sade: >-
    Ajanların eğitim sırasında ortak bir "eleştirmen"den yararlanarak öğrendiği yaygın bir çok ajanlı öğrenme yöntemi.
  teknik: >-
    Multi-Agent PPO: merkezi eleştirmen (varsayılan girdi tüm yerel gözlemler) + paylaşılan aktör. Ayarlar: mini-parti
    bölünmez, en fazla 10 epoch, clip 0,2, lr 5e-4 (M3a ön kaydı); BenchMARL 1.4 varsayılanları.
  kodda: [marl/m3_runner.py::build_experiment]
  ilgili: [ippo, elestirmen, ctde, ppo]
  kaynak: ["Yu vd. (2022)"]

- id: ippo
  terim: IPPO
  kisaltma: IPPO
  kategori: marl
  sade: >-
    Her ajanın eleştirmeninin yalnız kendi gözlemine baktığı sürüm.
  teknik: >-
    Independent PPO: eleştirmen yerel gözlemle; eğitici seçeneği --algo ippo. Eleştirmen kapasitesi MAPPO ile eşit
    değildir ve kayda geçer.
  kodda: [scripts/marl/train_m3.py::critic_summary]
  ilgili: [mappo, elestirmen]
  kaynak: ["de Witt vd. (2020)"]

- id: ctde
  terim: Merkezi eğitim, merkezi olmayan yürütme (CTDE)
  kisaltma: CTDE
  kategori: marl
  sade: >-
    Eğitimde ajanlar her şeyi görebilir, ama işlem anında her ajan yalnız kendi gözlemiyle karar verir.
  teknik: >-
    Centralised training, decentralised execution: eleştirmen eğitimde merkezi girdi alır; politika yalnız yerel
    gözlemi (iletişim kolunda ayrıca mesajları) kullanır. Canlı karar eleştirmeni kullanmaz.
  ilgili: [elestirmen, mappo]
  kaynak: ["Lowe vd. (2017)"]

- id: elestirmen
  terim: Eleştirmen
  kategori: marl
  sade: >-
    Eğitim sırasında "bu durum ne kadar iyi" diye puan veren yardımcı ağ. İşlem anında kullanılmaz.
  teknik: >-
    Değer fonksiyonu; MAPPO'da girdi tüm yerel gözlemler (varsayılan) ya da ortamın state()'i (--use-state). Bütün
    kollarda aynı BenchMARL MLP; parametre sayısı ve girdi boyutu kayda geçer.
  kodda: [scripts/marl/train_m3.py::critic_summary]
  ilgili: [ctde, mappo]

- id: parametre-paylasimi
  terim: Parametre paylaşımı (K24)
  kategori: marl
  sade: >-
    Bütün ajanlar aynı "beyni" kullanır. Hangi hisseye baktığını gözlemindeki kimlikten bilir.
  teknik: >-
    Tam paylaşım + ajan kimliği one-hot (K24); share_policy_params = True. Sektör başına seçici paylaşım ablasyon
    olarak planda.
  kodda: [marl/m3_runner.py::build_experiment]
  ilgili: [ajan, k-kararlari]

- id: iletisim-kollari
  terim: İletişim kolları (none / attn / gat / self)
  kategori: marl
  sade: >-
    Ajanların birbirine mesaj gönderip göndermediğini ve kime gönderdiğini belirleyen seçenekler.
  teknik: >-
    none: iletişimsiz MLP; attn: tam bağlı çok başlı öz-dikkat (TarMAC tipi); gat: aynı katmanlar, dikkat yalnız graf
    komşuları ve kendisiyle sınırlı; self: aynı katmanlar, dikkat yalnız kendine (mimari-eş iletişimsiz kontrol).
    attn, gat ve self'in parametre sayısı eşittir.
  kodda: [marl/comm_models.py::CommPolicy, marl/comm_models.py::graph_mask]
  belgede: [docs/development/phase-10-m4-design.md]
  ilgili: [graf, kol-kodlari-m4, dikkat]
  kaynak: ["Das vd. (2019)", "Veličković vd. (2018)"]

- id: dikkat
  terim: Dikkat (attention)
  kategori: marl
  sade: >-
    Bir ajanın gelen mesajların hangisine ne kadar kulak vereceğini öğrendiği mekanizma.
  teknik: >-
    puanᵢⱼ = qᵢ·kⱼ/√d (+ β·bⱼ güven terimi); softmax ağırlıklarıyla mesajlar toplanır, artık bağlantı ve LayerNorm.
    Çıktı başı [kendi kod ‖ mesaj sonrası] alır.
  kodda: [marl/comm_models.py::CommPolicy]
  ilgili: [iletisim-kollari, beta, s-msg]

- id: graf
  terim: Graf (sektör + MST)
  kategori: marl
  sade: >-
    Hangi hisselerin "komşu" sayılacağını gösteren bağlantı haritası: aynı sektördekiler ve fiyatları en çok birlikte hareket edenler.
  teknik: >-
    sector+mst kuralı: KAP sektör grupları + eğitim penceresi log getiri korelasyonundan (Pearson, çift bazında tam
    gözlemli günler) minimum yayılan ağaç. Kararlılık eğitim penceresinin iki yarısındaki grafların Jaccard'ıyla ölçülür.
  kodda: [scripts/marl/graph_m4.py::pairwise_corr]
  belgede: [docs/development/phase-10-m4-design.md]
  ilgili: [iletisim-kollari, komsu-sinyali]

- id: alfa
  terim: α (ödül karışımı)
  kisaltma: α
  kategori: marl
  sade: >-
    Bir ajanın ödülünde kendi hissesinin katkısıyla bütün portföyün başarısının hangi oranda karıştırılacağı.
  teknik: >-
    rᵢ = ölçek·(α·kᵢ + (1 − α)·G); kᵢ ajanın fazla getiri katkısı, G portföy terimi, α ∈ [0, 1). Referans yapılandırma
    α = 0,25, ölçek 100. 'differential' ödülü yalnız α = 0 ablasyonunda.
  kodda: [marl/accounting.py::agent_rewards]
  ilgili: [odul, fazla-getiri]

- id: logit-siniri
  terim: Logit sınırı (5 + ln N)
  kategori: marl
  sade: >-
    Bir ajanın tek bir hisseye ne kadar uç bir ağırlık isteyebileceğinin üst sınırı.
  teknik: >-
    Eylem logitleri [−B, B] aralığına kırpılır, B = 5 + ln N (kullanıcı kararı 2026-11-16); nakit logiti sabit 0.
  kodda: [marl/weights.py::logit_bound]
  ilgili: [ajan]

- id: s-obs
  terim: S-obs
  kategori: marl
  sade: >-
    Tahmin sinyalini ajanın kendi gözlemine eklemek.
  teknik: >-
    Gözlem bloğu [p_up_cal − 0,5, z(pred_logret), z(model_disagreement), pred_ok]; eksik tahmin maskelenir, 0,5'e
    düşülmez. Ölçek yalnız eğitim satırlarından.
  kodda: [marl/obs_spec.py::pred_block]
  ilgili: [s-msg, pit-tablosu, gozlem]

- id: s-msg
  terim: S-msg
  kategori: marl
  sade: >-
    Tahminin güvenini mesajlaşmada kullanmak: kendinden emin olan göndericinin mesajına daha çok kulak verilir.
  teknik: >-
    puanᵢⱼ = qᵢ·kⱼ/√d + β·bⱼ; bⱼ göndericinin güven terimi, alıcıdan bağımsız: prob = log kırp(0,5 + |p − 0,5|),
    zlogodds = |logit p| / z_scale. Güven gözlemden okunur; gözlem tanımı değişmez (K2).
  kodda: [marl/comm_models.py::confidence_term]
  belgede: [docs/development/phase-10-m5-design.md]
  ilgili: [beta, dikkat, s-obs, kol-kodlari-m5]
  kaynak: ["Yoffe vd. (2025)"]

- id: beta
  terim: β (güven ağırlığı)
  kisaltma: β
  kategori: marl
  sade: >-
    Güvenin dikkate ne kadar karışacağını belirleyen ayar. Sıfırsa güven hiç kullanılmaz.
  teknik: >-
    Sabit (0 = güvensiz dikkat, 1 = DebUnc ölçeklemesi) ya da öğrenilen bir skaler (0'dan başlar). Eğitim sonu değeri
    kayda geçer ve mekanizmanın kullanılıp kullanılmadığının denetimidir.
  kodda: [marl/comm_models.py::CommPolicy]
  ilgili: [s-msg, dikkat]

- id: guven-gecidi
  terim: Güven geçidi
  kategori: marl
  sade: >-
    Ajan kendi tahmininden emin değilse gelen mesajlara daha çok ağırlık veren anahtar.
  teknik: >-
    gᵢ = σ(a·dᵢ + b), dᵢ alıcının kendi güvensizliği; mesaj gᵢ ile ölçeklenir. Başlangıç a = 0, b = 4,6 (g ≈ 0,99).
    Komşu sinyali düzeninde sınanamaz, çünkü orada ajanın kendi güveni başka bir hisseye aittir.
  kodda: [marl/comm_models.py::CommPolicy]
  ilgili: [s-msg, beta, komsu-sinyali]

- id: kare
  terim: Kare (frame)
  kategori: marl
  sade: >-
    Eğitimde ortamla yapılan tek bir adım. Eğitim bütçesi kare sayısıyla ölçülür.
  teknik: >-
    BenchMARL max_n_frames; M3–M5 koşularında 600.000 kare, parti 6.000 kare, partide 10 epoch.
  kodda: [scripts/marl/train_m3.py]
  ilgili: [bolum]

- id: bolum
  terim: Bölüm (episode)
  kategori: marl
  sade: >-
    Eğitimde baştan sona oynanan bir dönem. Burada yaklaşık bir yıl (252 işlem günü).
  teknik: >-
    episode_len 252; bölüm sonu terminated = False ve GAE bootstrap (kesik bölüm, gerçek son değil).
  kodda: [marl/benchmarl_task.py]
  ilgili: [kare]

- id: benchmarl
  terim: BenchMARL / TorchRL
  kategori: marl
  sade: >-
    Çok ajanlı modelleri eğitmek için kullanılan hazır kütüphaneler. Eğitim döngüsü, algoritmalar ve deney kaydı bunlardan gelir.
  teknik: >-
    MarlTask (BenchMARL görevi) MARL ortamını sarar; algoritma MAPPO/IPPO, ağlar TorchRL. Yalnız venv-marl'da (K9). Tohum
    bit-eşliği için OMP_NUM_THREADS = MKL_NUM_THREADS = 1 torch import'undan önce ayarlanır.
  kodda: [marl/benchmarl_task.py::MarlTask, marl/m3_runner.py]
  ilgili: [venv-marl, mappo, ippo, kare]
  kaynak: ["Bettini vd. (2024)"]

- id: muhasebe
  terim: Muhasebe (kesirli adım)
  kategori: marl
  sade: >-
    Ortamın her gün portföy ağırlıklarını, nakit faizini, işlem maliyetini ve getiriyi nasıl hesapladığını belirleyen kurallar. Ortam ve canlı karar aynı fonksiyonu kullanır.
  teknik: >-
    Karar t kapanışında, yürütme t+1 açılışında: gece hisseler Oₜ₊₁/Cₜ ile kayar, nakit rf kazanır; açılışta hedef
    izdüşürülür ve maliyet c·τ bir kez düşer; seans içi Cₜ₊₁/Oₜ₊₁ (nakit seans içinde faiz kazanmaz). R = g1(1 − cτ)g2 − 1,
    X = R − rf. rf zorunludur, sabite düşülmez.
  kodda: [marl/accounting.py::step_fractional, marl/accounting.py::step_growth]
  belgede: [docs/development/phase-10-m2-design.md]
  ilgili: [devir, islem-maliyeti, risksiz-faiz, izdusum, k12]

- id: izdusum
  terim: Hedef ağırlık izdüşümü (risk projeksiyonu)
  kategori: marl
  sade: >-
    Ajanların istediği ağırlıkların, işlem yapılamayan hisseler ve tavan kuralları gibi kısıtlara uyacak şekilde düzeltilmesi.
  teknik: >-
    project(u, w_drift, tradable, Constraints): işlem göremeyen hisse kaymış ağırlığında tutulur, satış engeli (no_sell)
    uygulanır; band (dönüşüm bandı), max_position, max_group parametreleri varsayılan kapalı. Parametreler model meta'sına
    risk_projection olarak yazılır.
  kodda: [marl/weights.py::project, marl/weights.py::Constraints]
  ilgili: [eylem, satis-engeli, listeleme-kilidi, muhasebe]

- id: emir-donusumu
  terim: Emir dönüşümü
  kategori: marl
  sade: >-
    Hedef ağırlıkların gerçek alım-satım emirlerine, yani tam sayı lot adetlerine çevrilmesi.
  teknik: >-
    rebalance_orders(target_w, prices, holdings, cash, commission, ...): ortamın kesirli muhasebesiyle canlı kararın tam sayı
    emirleri aynı hedef ağırlıktan üretilir (K5); parite testleri bit-eşlik ister.
  kodda: [marl/orders.py::rebalance_orders, marl/orders.py::apply_to_holdings]
  ilgili: [izdusum, gunluk-karar, muhasebe]

- id: zlogodds
  terim: zlogodds güven terimi
  kategori: marl
  sade: >-
    Bir tahminin ne kadar emin olduğunu, olasılığın 0,5'ten uzaklığını ölçeklenmiş log-oran olarak ifade eden biçim.
  teknik: >-
    b_j = |log(p / (1 − p))| / z_scale; z_scale = eğitim satırlarında tahminli hücrelerin |logit p| standart sapması
    (conf_scale). Tahmini olmayan hücrede taban 0. Alternatif biçim 'prob': log(clip(0,5 + |p − 0,5|)).
  kodda: [marl/comm_models.py::confidence_term, marl/comm_models.py::conf_scale]
  ilgili: [beta, s-msg, kol-kodlari-m5, p-up-cal]

- id: init-std
  terim: Başlangıç eylem gürültüsü (init_std)
  kategori: marl
  sade: >-
    Eğitimin başında ajanların ne kadar rastgele davranacağını belirleyen ayar. Çok küçük olursa ajan yeterince denemez.
  teknik: >-
    TanhNormal politika, tanh öncesi başlangıç std'si init_std (biased_softplus); M3–M5 koşularında 0,12.
  kodda: [marl/m3_runner.py, scripts/marl/train_m3.py]
  ilgili: [politika, eylem, mappo]

- id: deterministik-degerlendirme
  terim: Deterministik değerlendirme
  kategori: marl
  sade: >-
    Eğitilmiş politikanın rastgelelik olmadan, bütün pencere boyunca tek seferde sınanması.
  teknik: >-
    eval_m3.py kayıtlı politikayı deterministic_rollout ile, tam eğitim ya da doğrulama penceresinde koşar ve günlük seriyi (tarih,
    getiri, fazla getiri, devir, nakit ağırlığı) yazar; baseline serileri aynı muhasebeyle üretilir. Sharpe ve okuma analiz
    betiğinde.
  kodda: [scripts/marl/eval_m3.py, marl/m3_runner.py::deterministic_rollout]
  ilgili: [pencereler, baseline-1n, muhasebe]

# ------------------------------------------------------------------ tek ajan ve genel RL
- id: politika
  terim: Politika
  kategori: rl
  sade: >-
    Ajanın gözlemden karara giden kuralı. Öğrenilen şey budur.
  teknik: >-
    MARL'da TanhNormal aktör; eğitimde başlangıç gürültüsü tanh öncesi std 0,12, değerlendirmede deterministik (mod).
  kodda: [marl/m3_runner.py::deterministic_rollout]
  ilgili: [ajan, gozlem, odul]

- id: gozlem
  terim: Gözlem
  kategori: rl
  sade: >-
    Ajanın karar anında gördüğü bilgiler.
  teknik: >-
    marl-obs-v1: 11 z-ölçekli özellik, feat_ok, kendi ağırlığı, nakit ağırlığı, ajan kimliği (N), isteğe bağlı tahmin
    bloğu. Normalizasyon yalnız eğitim satırlarından (norm_stats); t+1 geçerliliği gözleme konmaz.
  kodda: [marl/obs_spec.py::build_obs_at]
  ilgili: [s-obs, nokta-zamanlilik, politika]

- id: odul
  terim: Ödül
  kategori: rl
  sade: >-
    Ajana "ne kadar iyi yaptın" diye verilen sayı. Öğrenme bunu artırmaya çalışır.
  teknik: >-
    MARL birincil ödülü 'excess' (fazla getiri katkısı ve portföy terimi, α karışımı). Tek ajan ortamında varsayılan
    Sharpe terimi EMA Sharpe düzeyidir; ödül tanımının tek kaynağı reward-definition.md.
  kodda: [marl/accounting.py::agent_rewards, env/reward_functions.py]
  belgede: [docs/thesis/reward-definition.md]
  ilgili: [fazla-getiri, alfa, ema-sharpe]

- id: ema-sharpe
  terim: EMA Sharpe düzeyi
  kategori: rl
  sade: >-
    Tek ajanlı modelin ödülünde, son dönem getirilerinin üstel ortalamasından hesaplanan Sharpe benzeri terim.
  teknik: >-
    Varsayılan sharpe_term = 'ema_level'. Moody–Saffell'in Dₜ türevi değildir; o seçimli olarak sharpe_term =
    'differential' ile (Faz 9 G1). Komisyon ödülde iki kez sayılıyor (beyan).
  kodda: [env/reward_functions.py]
  belgede: [docs/thesis/reward-definition.md]
  ilgili: [odul]
  kaynak: ["Moody & Saffell (2001)"]
  uyari: >-
    Bu terime "diferansiyel Sharpe" denmez (tez kuralı, docs/thesis/CLAUDE.md).

- id: ppo
  terim: PPO
  kisaltma: PPO
  kategori: rl
  sade: >-
    Politikayı küçük ve güvenli adımlarla güncelleyen yaygın bir öğrenme yöntemi.
  teknik: >-
    Proximal Policy Optimization: kırpılmış olasılık oranı amacı (clip ε = 0,2). MAPPO ve IPPO bunun çok ajanlı
    sürümleridir.
  ilgili: [mappo, ippo, politika]
  kaynak: ["Schulman vd. (2017)"]

- id: eylem
  terim: Eylem
  kategori: rl
  sade: >-
    Ajanın her adımda verdiği karar. Bu sistemde eylem, paranın hisseler ve nakit arasında nasıl dağıtılacağını söyler.
  teknik: >-
    MARL: her ajan kendi hissesi için bir logit üretir; logitler logit sınırında kırpılır, nakit logiti 0 sabit, softmax
    hedef ağırlığı verir (target_weights), sonra kısıtlara izdüşürülür (project). Tek ajan ortamı: hisse başına [-1, +1]
    sürekli çıktı, lot sayısına ölçeklenir (max_shares_per_trade).
  kodda: [marl/weights.py::target_weights, marl/weights.py::project, env/trading_env.py::TradingEnv]
  ilgili: [politika, logit-siniri, gozlem]

- id: tek-ajan-ortami
  terim: Tek ajan ortamı (TradingEnv)
  kategori: rl
  sade: >-
    Bütün hisseleri tek bir ajanın yönettiği eski öğrenme ortamı. Ansari replikasyonu ve Milestone 0' bu ortamda koşulur.
  teknik: >-
    Gymnasium ortamı; gözlem bakiye + hisse adetleri + OHLCV + göstergeler (5 sembolde 56, 30 sembolde 331 boyut), faz 2
    tahmin bloğuyla genişler. State space yapısı eğitilmiş modellerle uyum için değiştirilmez; yeni MARL ortamı ayrıdır.
  kodda: [env/trading_env.py::TradingEnv, env/trading_env.py::make_env]
  belgede: [env/CLAUDE.md]
  ilgili: [ansari-replikasyonu, milestone-0p, ohlcv, gymnasium]

- id: gymnasium
  terim: Gymnasium
  kategori: rl
  sade: >-
    Pekiştirmeli öğrenme ortamları için standart arayüz kütüphanesi. Ortam "gözlem ver, eylem al, ödül döndür" kalıbıyla yazılır.
  teknik: >-
    TradingEnv gym.Env alt sınıfıdır (reset/step, observation_space ve action_space Box). MARL ortamı aynı kalıbın çok ajanlı
    karşılığı PettingZoo ile yazılır ve yalnız venv-marl'da çalışır.
  kodda: [env/trading_env.py::TradingEnv, marl/env.py]
  ilgili: [tek-ajan-ortami, venv-marl]
  kaynak: ["Towers vd. (2024)"]

- id: sb3
  terim: Stable-Baselines3
  kisaltma: SB3
  kategori: rl
  sade: >-
    Tek ajanlı modelleri eğitmek için kullanılan hazır algoritma kütüphanesi.
  teknik: >-
    Eğitim rotası PPO, A2C, TD3 ve SAC'ı SB3'ten kurar; model .zip olarak kaydedilir, yanına evren ve ölçeği taşıyan
    model meta dosyası yazılır. MARL tarafı SB3 değil BenchMARL/TorchRL kullanır.
  kodda: [app/api/routes/trading.py]
  ilgili: [ppo, a2c, td3, sac, model-meta, benchmarl]
  kaynak: ["Raffin vd. (2021)"]

- id: a2c
  terim: A2C
  kisaltma: A2C
  kategori: rl
  sade: >-
    Politikayı ve değer tahminini aynı anda öğrenen, eşzamanlı çalışan bir öğrenme yöntemi.
  teknik: >-
    Advantage Actor-Critic (A3C'nin eşzamanlı sürümü); eğitim rotasında algorithm = 'a2c' ile SB3'ten.
  kodda: [app/api/routes/trading.py]
  ilgili: [ppo, sb3, elestirmen]
  kaynak: ["Mnih vd. (2016)"]

- id: td3
  terim: TD3
  kisaltma: TD3
  kategori: rl
  sade: >-
    Sürekli eylemler için, değeri olduğundan yüksek tahmin etme eğilimini azaltan bir öğrenme yöntemi.
  teknik: >-
    Twin Delayed DDPG: iki eleştirmenin küçüğü, gecikmeli politika güncellemesi, hedef politika yumuşatma; algorithm =
    'td3' ile SB3'ten.
  kodda: [app/api/routes/trading.py]
  ilgili: [sb3, elestirmen, sac]
  kaynak: ["Fujimoto vd. (2018)"]

- id: sac
  terim: SAC
  kisaltma: SAC
  kategori: rl
  sade: >-
    Ödülle birlikte davranıştaki çeşitliliği de ödüllendiren, sürekli eylemli bir öğrenme yöntemi.
  teknik: >-
    Soft Actor-Critic (entropi düzenlemeli, politika dışı); eğitim rotasında algorithm = 'sac' ile SB3'ten seçilebilir.
  kodda: [app/api/routes/trading.py]
  ilgili: [sb3, td3]

- id: hpo
  terim: Hiperparametre optimizasyonu
  kisaltma: HPO
  kategori: rl
  sade: >-
    Öğrenme hızı gibi ayarların, çok sayıda deneme yapılarak otomatik seçilmesi. Her deneme deneme kaydına sayılır.
  teknik: >-
    Optuna, varsayılan TPE örnekleyici (ayar tohumuyla kurulur) ve budayıcı. HPO rotanın yolunu kullanır: panel, kat ve
    ortam evaluation/rl_folds'tan, pencere wf-v1 katından; arama doğrulama bloğunda yapılır, test okunmaz.
  kodda: [hyperparameter_optimization/base_optimizer.py, evaluation/rl_folds.py::build_fold]
  belgede: [env/CLAUDE.md]
  ilgili: [walk-forward, deneme-kaydi, pencereler]
  kaynak: ["Akiba vd. (2019)", "Bergstra vd. (2011)"]

- id: walk-forward
  terim: Kayan pencereli bölme (wf-v1)
  kategori: rl
  sade: >-
    Verinin zamanda ilerleyen katlara bölünmesi: her katta model geçmişle eğitilir, bir sonraki yılda sınanır.
  teknik: >-
    wf-v1: 6 kat, test = takvim yılı 2021..2026, doğrulama = bir önceki yıl, eğitim 2013-06'dan genişleyen; purge 0.
    Tanım değişmez, uzatmak yeni sürümdür (wf-v2). Seçim yalnız doğrulamada (10 kontrol noktası), test seçilen modelle bir
    kez okunur.
  kodda: [evaluation/splits.py::get_spec, evaluation/splits.py::fold_frames, evaluation/rl_folds.py::build_fold]
  ilgili: [pencereler, kontrol-noktasi-secimi, hpo]
  kaynak: ["López de Prado (2018)"]

- id: kontrol-noktasi-secimi
  terim: Kontrol noktası seçimi
  kategori: rl
  sade: >-
    Eğitim boyunca kaydedilen ara modellerden hangisinin kullanılacağına karar verme kuralı.
  teknik: >-
    Tek ajan: eğitim 10 kontrol noktasına bölünür, doğrulamada fazla getiri Sharpe'ı en yüksek olan seçilir
    ('argmax_validation'); son nokta ('last_checkpoint') de ayrı kayıt olarak yazılır, ikisi de N'ye sayılır. MARL
    geliştirme koşularında son ağırlıklar kullanılır.
  kodda: [evaluation/rl_folds.py::select_checkpoint, evaluation/rl_folds.py::checkpoint_grid]
  ilgili: [walk-forward, deneme-kaydi, fazla-getiri]

- id: moody-saffell
  terim: Moody–Saffell Dₜ terimi
  kategori: rl
  sade: >-
    Sharpe oranının her adımdaki değişimini ödül olarak veren klasik yöntem. Bu projede yalnız seçimli bir kol olarak var.
  teknik: >-
    Moody–Saffell Dₜ türevi; tek ajan ortamında sharpe_term = 'differential' (yalnız reward_type = 'psr'). MARL'da 'differential' ödül
    terimi yalnız α = 0 ablasyonu içindir. Varsayılan tek ajan terimi EMA Sharpe düzeyidir.
  kodda: [env/reward_functions.py::RewardCalculator]
  belgede: [docs/thesis/reward-definition.md]
  ilgili: [ema-sharpe, odul, sharpe, alfa]
  kaynak: ["Moody & Saffell (2001)"]
  uyari: >-
    Varsayılan tek ajan terimi (EMA Sharpe düzeyi) bu terim değildir; ona "diferansiyel Sharpe" denmez (tez kuralı).

- id: psr-odulu
  terim: PSR ödülü
  kategori: rl
  sade: >-
    Tek ajanlı modelde getiriyi, riski ve işlem maliyetini birlikte tartan karma ödül.
  teknik: >-
    reward_type = 'psr' (faz 2); ağırlıklar w1–w5, Sharpe terimi sharpe_term ile seçilir. 'simple' ödül portföy değeri
    değişimidir. Tanımın tek kaynağı reward-definition.md; ödülü değiştiren commit onu da günceller.
  kodda: [env/reward_functions.py::RewardCalculator, env/reward_functions.py::SimpleRewardCalculator]
  belgede: [docs/thesis/reward-definition.md]
  ilgili: [odul, ema-sharpe, moody-saffell]

- id: atr-kelly
  terim: ATR ve Kelly pozisyon boyutlandırma
  kategori: rl
  sade: >-
    Alınacak hisse miktarını oynaklığa ya da kazanma olasılığına göre ayarlayan seçimli kurallar. Varsayılan olarak kapalıdır.
  teknik: >-
    use_atr_sizing (ATR tabanlı lot) ve use_kelly (f* = (p·b − q·a)/(a·b), kesirli Kelly), ikisi de varsayılan False;
    eğitilmiş modeller bozulmasın diye açılmaz.
  kodda: [env/trading_env.py::TradingEnv]
  ilgili: [tek-ajan-ortami]
  kaynak: ["Kelly (1956)"]

- id: turbulans
  terim: Türbülans endeksi
  kategori: rl
  sade: >-
    Piyasanın olağandışı çalkantılı olup olmadığını gösteren gösterge. Eski ortamda gözleme girer ama neredeyse hep tavanda kalır.
  teknik: >-
    Çok sembollü hesapta kesitsel Mahalanobis uzaklığı, sembol düzeyinde yedek olarak 252 günlük kayan oynaklık × 100.
    Gözlemde tanh(turbulence/2); bu terim doygun olduğu için eski ortamın her kolunda obs_health açık kalır (K26 = a,
    beyan).
  kodda: [data/technical_indicators.py, evaluation/observation_health.py::observation_health]
  ilgili: [gozlem-sagligi, teknik-gostergeler, tek-ajan-ortami]

- id: gozlem-sagligi
  terim: Gözlem sağlığı (obs_health)
  kategori: rl
  sade: >-
    Ajanın gördüğü sayıların kırpılıp kırpılmadığını, hep aynı değerde takılıp kalmadığını ve eğitimde görülen aralıkta olup olmadığını ölçen denetim.
  teknik: >-
    Kapılı bloklarda kırpma ≤ %1, sabit boyut yok, özellik başına doygunluk ≤ %90; features_in_support (havuzlu) ve
    dims_in_support (her sembol × özellik boyutu ≤ %1). Ölçülür ve kayda yazılır; geçmeyen kol protocol_open alır.
  kodda: [evaluation/observation_health.py::observation_health, evaluation/observation_health.py::dims_in_support]
  ilgili: [turbulans, fiyat-olcegi, protokol-acik, gozlem]

- id: fiyat-olcegi
  terim: Fiyat ölçeği (price_norm)
  kategori: rl
  sade: >-
    Fiyatların ajana verilmeden önce hangi ortalama ve yayılımla küçültüldüğü. Değerlendirme ortamı eğitim ortamının ölçeğini kullanmak zorundadır.
  teknik: >-
    'stats': eğitim ortamından price_stats (held-out ortama verilmesi zorunlu, None reddedilir); 'causal': sembolün ≤ t son
    252 kapanışının ölçeği (K25 b). Kökeni beyanla değil ölçümle etiketlenir (rl_eval_protocol).
  kodda: [env/trading_env.py::TradingEnv, evaluation/trial_registry.py]
  belgede: [env/CLAUDE.md]
  ilgili: [gozlem-sagligi, nokta-zamanlilik, tek-ajan-ortami]

- id: eksik-veri-modu
  terim: Eksik veri modu
  kategori: rl
  sade: >-
    Bir hissenin o gün verisi yoksa ortamın ne yapacağını belirleyen ayar.
  teknik: >-
    missing_data_mode = 'legacy' (varsayılan, eğitilmiş modeller): eksik hücrede önceki sembolün bloğunu kopyalar ve fiyatı
    0 sayar (bilinen hata, dondurulmuş). 'own_last': sembolü kendi son gözlemiyle taşır, o hücrede işlem yapmaz; yeni eğitim
    ve HPO bunu kullanır.
  kodda: [env/trading_env.py::TradingEnv]
  ilgili: [eksik-hucre, tek-ajan-ortami, hpo]

# ------------------------------------------------------------------ tahmin hattı
- id: auc
  terim: AUC
  kisaltma: AUC
  kategori: tahmin
  sade: >-
    Bir tahminin yükselen ve düşen günleri ne kadar iyi ayırdığı. 0,5 yazı-tura, 1 kusursuz demektir.
  teknik: >-
    ROC eğrisi altındaki alan; p_up_cal ile yön etiketi arasında.
  kodda: [evaluation/calibration.py::auc]
  ilgili: [bilgi-kapisi, pozitif-kontrol]

- id: pit-tablosu
  terim: P tablosu (pit_v1 / pit_v2)
  kategori: tahmin
  sade: >-
    Her gün için, yalnız o gün bilinebilecek veriyle üretilmiş tahminlerin tablosu.
  teknik: >-
    Nokta-zamanlı ve örneklem dışı tahmin tablosu. pit_v1 kapanıştan kapanışa (Cₜ → Cₜ₊₁) yönü, pit_v2 (P5) K12
    ufkundaki açılıştan açılışa (Oₜ₊₁ → Oₜ₊₂) yönü tahmin eder.
  kodda: [prediction/pit_table.py]
  ilgili: [nokta-zamanlilik, k12, bilgi-kapisi]

- id: bilgi-kapisi
  terim: Bilgi kapısı (İ3)
  kategori: tahmin
  sade: >-
    Bir tahmin sinyalinin gerçekten bilgi taşıyıp taşımadığını, kullanılmadan önce sınayan test.
  teknik: >-
    Sembol başına: AUC için tek taraflı yüzdelik blok bootstrap p (H0: AUC ≤ 0,5), 30 sembol tek aile BH; BSS (taban
    oranı test dışından) ve MDE raporlanır. Kapıyı geçmeyen sinyalin güveni "sıcaklık ölçekli, ayırt edici değil" diye
    anılır, "kalibre" denmez.
  kodda: [prediction/pit_table.py::evaluate_gate]
  ilgili: [auc, bh-fdr, mde, kalibrasyon]

- id: kalibrasyon
  terim: Kalibrasyon (sıcaklık)
  kategori: tahmin
  sade: >-
    Tahminin söylediği olasılığın gerçekleşen sıklığa uyması: "%60" denen günlerin yaklaşık %60'ı gerçekten yükselmeli.
  teknik: >-
    Sıcaklık ölçekleme: tek parametre T > 0, doğrulama kümesinde NLL en küçüklenir, p = σ(z / T). ECE ve Brier ile
    ölçülür.
  kodda: [evaluation/calibration.py::fit_temperature, evaluation/calibration.py::apply_temperature]
  ilgili: [bilgi-kapisi, auc]

- id: tahmin-ensemble
  terim: Tahmin topluluğu (stacking ensemble)
  kategori: tahmin
  sade: >-
    Birkaç farklı tahmin modelinin çıktısını birleştirip tek bir tahmin üreten yapı. Canlı tahmin sayfası bunu kullanır.
  teknik: >-
    StackingEnsemble: taban modeller XGBoost, LightGBM, CatBoost, BiLSTM, TFT; meta-öğrenici bunların örneklem dışı (OOF)
    tahminleriyle eğitilir. Kronolojik 60/20/20 bölme. MARL ajanlarına giden sinyal bu sınıftan değil P tablosundan gelir.
  kodda: [prediction/models/ensemble.py::StackingEnsemble]
  belgede: [prediction/CLAUDE.md]
  ilgili: [gbm-modelleri, bilstm, tft, meta-ogrenici, oof, pit-tablosu]
  kaynak: ["Wolpert (1992)"]
  uyari: >-
    "Sızıntı yok" denmez: dağıtım öncesi %80 yeniden uyumda meta-öğrenici örneklem içi tahminlerle yeniden uyduruluyor (K19).

- id: gbm-modelleri
  terim: Gradyan artırma modelleri (XGBoost, LightGBM, CatBoost)
  kisaltma: GBM
  kategori: tahmin
  sade: >-
    Çok sayıda küçük karar ağacını art arda ekleyerek tahmin yapan modeller. P tablosunun taban modelleri bunlardır.
  teknik: >-
    XGBoostModel, LightGBMModel, CatBoostModel (BasePredictionModel alt sınıfları). P tablosunda V1_MODELS = xgboost,
    lightgbm, catboost; yalnız fiyat/hacim özellikleri, her çapada yeniden eğitim.
  kodda: [prediction/models/xgboost_model.py::XGBoostModel, prediction/models/lightgbm_model.py::LightGBMModel, prediction/models/catboost_model.py::CatBoostModel, prediction/pit_table.py::V1_MODELS]
  ilgili: [tahmin-ensemble, pit-tablosu, capa]
  kaynak: ["Chen & Guestrin (2016)", "Ke vd. (2017)", "Prokhorenkova vd. (2018)"]

- id: bilstm
  terim: BiLSTM
  kisaltma: BiLSTM
  kategori: tahmin
  sade: >-
    Zaman serisini hem ileri hem geri yönde okuyan bir derin öğrenme modeli.
  teknik: >-
    Çift yönlü LSTM; getiri tahminine ek olarak bir yön başı (_predict_direction_raw) taşır. Eğitim penceresi satır i'yi
    içerir (B11); yön etiketi ham hedeften.
  kodda: [prediction/models/lstm_model.py::BiLSTMModel]
  ilgili: [tft, yon-basi, tahmin-ensemble]
  kaynak: ["Hochreiter & Schmidhuber (1997)", "Schuster & Paliwal (1997)"]

- id: tft
  terim: TFT
  kisaltma: TFT
  kategori: tahmin
  sade: >-
    Hangi girdinin ne zaman önemli olduğunu dikkat mekanizmasıyla seçen bir derin öğrenme tahmin modeli.
  teknik: >-
    Temporal Fusion Transformer: geçitli artık ağlar, değişken seçim ağı, dikkat; yön başı taşır. Gruplanmış VSN gibi hız
    ayarları golden'ı değiştirdiği için varsayılan kapalı.
  kodda: [prediction/models/tft_model.py::TFTModel]
  ilgili: [bilstm, yon-basi, tahmin-ensemble, dikkat]
  kaynak: ["Lim vd. (2021)"]

- id: yon-basi
  terim: Yön başı
  kategori: tahmin
  sade: >-
    Derin öğrenme modellerinin, fiyat tahminine ek olarak "yükselir mi düşer mi" sorusuna verdiği ayrı çıktı.
  teknik: >-
    BiLSTM/TFT _predict_direction_raw. confidence_mode = 'legacy' (varsayılan): yön fiyat işaretinden, güven yön başlarının
    ortalamasından max(p, 1 − p); ikisi zıt yönü gösterebilir (Y4, head_vs_price_conflict_rate ile ölçülür).
  kodda: [prediction/models/base.py::BasePredictionModel, prediction/models/ensemble.py::CONFIDENCE_MODES]
  ilgili: [bilstm, tft, p-up-cal]

- id: meta-ogrenici
  terim: Meta-öğrenici
  kategori: tahmin
  sade: >-
    Taban modellerin tahminlerini girdi olarak alıp hangisine ne kadar güvenileceğini öğrenen üst model.
  teknik: >-
    Topluluk: Ridge ya da XGBoost (meta_learner_type). P tablosu: lojistik meta, yalnız geçmiş blokların örneklem dışı
    tahminlerinde uydurulur (K19: %80 yeniden uyum ve örneklem içi meta yok).
  kodda: [prediction/models/ensemble.py::StackingEnsemble, prediction/pit_table.py::meta_layer]
  ilgili: [tahmin-ensemble, oof, pit-tablosu]
  kaynak: ["Wolpert (1992)", "Hoerl & Kennard (1970)"]

- id: oof
  terim: Örneklem dışı tahmin (OOF)
  kisaltma: OOF
  kategori: tahmin
  sade: >-
    Bir modelin, eğitimde görmediği veriler için ürettiği tahmin. Üst model yalnız bunlarla eğitilirse kendini kandırmaz.
  teknik: >-
    Out-of-fold: topluluğun 60/20/20 bölmesinde orta dilim meta-eğitim için ayrılır. P tablosunda taban eğitimi label_date
    < çapa ile sınırlanır; meta ve sıcaklık yalnız geçmiş blokların OOF tahminlerinde.
  kodda: [prediction/pit_table.py::base_predictions, prediction/pit_table.py::meta_layer]
  ilgili: [meta-ogrenici, capa, arindirma]

- id: capa
  terim: Çapa (yeniden eğitim noktası)
  kategori: tahmin
  sade: >-
    P tablosunda modellerin yeniden eğitildiği tarihler. Her çapada yalnız o tarihe kadar gerçekleşmiş etiketler kullanılır.
  teknik: >-
    FIRST_ANCHOR = 2012-01-01, RETRAIN_EVERY = 63 seans; satırın bloğu kendinden önceki son çapadır. Sıcaklık çapa başına 30
    sembolde havuzlu; informative_asof çapa anındaki bilgi kapısı.
  kodda: [prediction/pit_table.py::make_anchors, prediction/pit_table.py::RETRAIN_EVERY]
  ilgili: [pit-tablosu, oof, bilgi-kapisi, kalibrasyon]

- id: arindirma
  terim: Arındırma ve ambargo (purge / embargo)
  kategori: tahmin
  sade: >-
    Eğitim ile sınama verisi arasına boşluk bırakmak. Etiketi sınama dönemine taşan eğitim satırları böylece dışarıda kalır.
  teknik: >-
    Tahmin eğiticisi purge_days = 5, embargo_days = 3 (WalkForwardTrainer). P tablosunda arındırma ufku label_steps: pit_v1'de
    h, pit_v2'de h + 1 seans (taban erken durdurma ve meta yarıları dahil).
  kodda: [prediction/trainer.py::WalkForwardTrainer, prediction/pit_table.py::label_steps]
  ilgili: [oof, nokta-zamanlilik, k12, walk-forward]
  kaynak: ["López de Prado (2018)"]

- id: tahmin-ufku
  terim: Tahmin ufku
  kategori: tahmin
  sade: >-
    Tahminin ne kadar ileriyi hedeflediği: bir gün sonrası ya da bir hafta sonrası gibi.
  teknik: >-
    horizon 'daily' (h = 1) ya da 'weekly' (h = 5 seans). pit_v1 hedefi Cₜ₊ₕ / Cₜ, pit_v2 (K12) hedefi Oₜ₊₁₊ₕ / Oₜ₊₁; etiket
    tarihi pit_v2'de t + h + 1.
  kodda: [prediction/pit_table.py::horizon_steps, prediction/pit_table.py::TARGETS]
  ilgili: [pit-tablosu, k12, arindirma]

- id: p-up-cal
  terim: p_up_cal (kalibre edilmiş yükseliş olasılığı)
  kategori: tahmin
  sade: >-
    Tahminin "fiyat yükselecek" olasılığı, sıcaklık ölçeklemesinden geçirilmiş haliyle. Ajanların gördüğü tahmin sinyalinin ana parçasıdır.
  teknik: >-
    Meta lojistik p(UP), sıcaklık T ile ölçeklenir; yön = 1[p_cal ≥ 0,5]. P tablosunda PRED_FIELDS'in ilk alanı. Bilgi
    kapısını geçmeyen bir p_up_cal için "kalibre" denmez, "sıcaklık ölçekli" denir.
  kodda: [marl/obs_spec.py::PRED_FIELDS, prediction/models/ensemble.py::StackingEnsemble]
  ilgili: [kalibrasyon, bilgi-kapisi, s-obs, yon-basi]

- id: ece
  terim: ECE
  kisaltma: ECE
  kategori: tahmin
  sade: >-
    Söylenen olasılıklarla gerçekleşen sıklıklar arasındaki ortalama uyumsuzluk. Küçük olması iyi kalibrasyon demektir.
  teknik: >-
    Expected Calibration Error: 15 kutu, kutu ağırlıklı |ortalama p − gerçekleşen oran|. Tracker'daki 5 kutulu
    compute_calibration bununla karıştırılmaz.
  kodda: [evaluation/calibration.py::ece, evaluation/calibration.py::reliability]
  ilgili: [kalibrasyon, brier]
  kaynak: ["Naeini vd. (2015)", "Guo vd. (2017)"]

- id: brier
  terim: Brier skoru ve BSS
  kisaltma: BSS
  kategori: tahmin
  sade: >-
    Olasılık tahminlerinin ortalama kare hatası ve bunun "hep ortalamayı söylemek"e göre ne kadar iyi olduğu. BSS sıfırın üstündeyse tahmin bir şey katıyordur.
  teknik: >-
    Brier = ortalama (p − y)²; BSS = 1 − Brier / Brier(taban oranı), taban oranı test dışından. Bilgi kapısının üç
    koşulundan biri BSS > 0'dır.
  kodda: [evaluation/calibration.py::brier, evaluation/calibration.py::brier_skill]
  ilgili: [ece, bilgi-kapisi, kalibrasyon]
  kaynak: ["Brier (1950)"]

- id: tats
  terim: TATS
  kisaltma: TATS
  kategori: tahmin
  sade: >-
    Bir eğilim sınıflandırıcısının çıktısıyla getiri tahminini düzelten yöntem. Bu projede uyarlanmış haliyle kullanılır.
  teknik: >-
    TATSCorrector (correction_factor, flat_threshold); uyum girdileri ham kapanıştan. Uyarlama işareti korur, makaledeki gibi
    yönü çevirmez; test metriğinde TATS'lı ve TATS'sız sonuç ayrı tutulur.
  kodda: [prediction/tats.py::TATSCorrector]
  belgede: [prediction/CLAUDE.md]
  ilgili: [tda, tahmin-ensemble]
  kaynak: ["Kazemdehbashi (2026)"]

- id: tda
  terim: Yön isabeti (TDA ve direction_accuracy)
  kisaltma: TDA
  kategori: tahmin
  sade: >-
    Tahminin yönü doğru bilme oranı. Kodda iki farklı tanım olduğu için hangisinin kullanıldığı her zaman yazılır.
  teknik: >-
    compute_metrics'in direction_accuracy'si fark tabanlıdır (np.diff) ve makaledeki TDA değildir; TATS karşılaştırmasında
    ensemble_test_metrics['tats'][*]['tda'] kullanılır.
  kodda: [prediction/models/base.py::BasePredictionModel]
  belgede: [evaluation/CLAUDE.md]
  ilgili: [tats]

- id: iceemdan
  terim: ICEEMDAN gürültü ayrıştırma
  kisaltma: ICEEMDAN
  kategori: tahmin
  sade: >-
    Fiyat serisini farklı hızlarda dalgalanan bileşenlere ayırıp gürültüyü süzen yöntem.
  teknik: >-
    ICEEMDANProcessor.decompose. Mevcut uygulama seriyi bütünüyle ayrıştırdığı için ileriye bakış taşır; tezde katkı olarak
    sunulmaz (vision-and-scope §5.4).
  kodda: [prediction/iceemdan_processor.py::ICEEMDANProcessor]
  belgede: [docs/thesis/vision-and-scope.md]
  ilgili: [tahmin-ensemble, nokta-zamanlilik]
  kaynak: ["Colominas vd. (2014)"]

- id: shap
  terim: SHAP açıklaması
  kisaltma: SHAP
  kategori: tahmin
  sade: >-
    Bir tahminde hangi girdinin ne kadar pay sahibi olduğunu gösteren açıklama yöntemi.
  teknik: >-
    ModelExplainer (explain_prediction, explain_global). SHAP ucu predict_next'ten farklı bir girdi matrisi kuruyor (Y30
    açık); açıklama canlı tahminle birebir aynı girdiye dayanmayabilir.
  kodda: [prediction/explainability.py::ModelExplainer]
  ilgili: [tahmin-ensemble]

- id: tahmin-izleyici
  terim: Tahmin izleyici (tracker)
  kategori: tahmin
  sade: >-
    Canlı tahminleri kaydedip, gerçekleşen fiyat geldikçe ne kadar isabetli olduklarını izleyen bileşen.
  teknik: >-
    PredictionTracker; kurallar tek yerde (tracker_rules). prediction_date = feature_date + h iş günü; gerçekleşen kapanış
    feature_date'ten sonraki h. gerçek seans. Geçersiz kayıt (invalid_reason) ve bayat özellikli kayıt değerlendirilmez.
  kodda: [prediction/tracker.py::PredictionTracker, prediction/tracker_rules.py::invalid_reason, prediction/tracker_rules.py::actual_after_sessions]
  belgede: [prediction/CLAUDE.md]
  ilgili: [tahmin-ufku, tahmin-ensemble]
  uyari: >-
    GOLD_GRAM_TRY'de gerçekleşen kapanış GC=F'ten (ons, USD) çekiliyor; o sembolde isabet anlamsız (Y31 açık).

- id: mask-reason
  terim: Maske nedeni (mask_reason)
  kategori: tahmin
  sade: >-
    Tahmin tablosunda bir hücre için tahmin olmadığında, nedeninin açıkça yazıldığı alan. Eksik tahmin sessizce yazı-turaya çevrilmez.
  teknik: >-
    MASK_REASONS = ok, no_data, no_features, insufficient_history, model_failed, meta_insufficient. MARL gözleminde
    pred_ok bayrağına dönüşür; tek ajan ortamında env_prediction_features maskeli hücreyi nötr (0) yapar.
  kodda: [prediction/pit_table.py::MASK_REASONS, prediction/pit_table.py::env_prediction_features]
  ilgili: [pit-tablosu, eksik-hucre, s-obs]

# ------------------------------------------------------------------ veri
- id: bist30
  terim: BIST-30
  kategori: veri
  sade: >-
    Borsa İstanbul'un en büyük 30 şirketinin hissesinden oluşan endeks. Sistem bu hisselerde işlem yapar.
  teknik: >-
    Sembol evreni tek kaynaktan okunur; panel sırası bu kaynağın sırasıdır (sorted() uygulanmaz). Üyelik değişimleri ve
    KAP sektör grupları ayrıca izlenir.
  kodda: [data/bist30_symbols.py]
  ilgili: [panel]

- id: panel
