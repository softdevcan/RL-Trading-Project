  kategori: veri
  sade: >-
    Borsanın aslında kapalı olduğu halde veride işlem günü gibi görünen günler ve tek bir hissede donmuş kalmış satırlar.
  teknik: >-
    Hayalet gün: aktif satırların ≥ %90'ı düz (volume = 0 ve O = H = L = C). Bayat hücre: tek sembolün düz satırı; atılır ve
