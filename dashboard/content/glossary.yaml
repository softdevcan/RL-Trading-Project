- id: makro-veri
  terim: Makro veri (yurt içi)
  kategori: veri
  sade: >-
    Faiz ve enflasyon gibi ekonominin genel durumunu gösteren seriler. Yalnız açıklandıkları günden sonra kullanılır.
  teknik: >-
    Nokta-zamanlı (B3): ay m TÜFE/ÜFE'si m+1'in 6'sından, politika faizi m+1'in 1'inden geçerli; bfill yok (B1). Olay
    zamanlıdır, vintage değil. Makro seri 2018'de başlar; tek ajan faz 2 ortamı 2013–2017'de makro gözlemi 0 görür (bilinen
    açık).
  kodda: [data/macro_fetcher.py::MacroDataFetcher]
  belgede: [data/CLAUDE.md]
  ilgili: [evds, nokta-zamanlilik, kuresel-makro]

- id: kuresel-makro
  terim: Küresel makro (VIX, US10Y, DXY)
  kategori: veri
  sade: >-
    Dünya piyasalarındaki korku, ABD faizi ve dolar gücünü gösteren üç seri. Yalnız tahmin hattına girer, ajanın gözlemine girmez.
  teknik: >-
    yfinance'ten (vix, us10y, dxy; ayrıca usd_try, eur_try, bist100_index). RL state space'e eklenmez: eğitilmiş modellerin
    gözlem boyutu bozulmasın diye macro_features sabit kodlanmaz.
  kodda: [data/macro_fetcher.py::MacroDataFetcher]
  ilgili: [makro-veri, yfinance, tahmin-ensemble]

- id: endeks-serileri
  terim: Endeks serileri (XU100, XU030)
  kategori: veri
  sade: >-
    Borsa İstanbul'un 100 ve 30 hisselik endekslerinin günlük kapanışları. Karşılaştırma ve piyasa dönemi etiketi için kullanılır.
  teknik: >-
    XU100 uzun seri data/macro/xu100.csv (2005..; |r| > %15 sıçramada yazılmaz); XU030 fiyat endeksi (temettüsüz) baseline
    için. İkisi de kaynak JSON ve SHA ile.
  kodda: [data/index_fetcher.py::fetch_index_close, data/index_fetcher.py::check_index_series, evaluation/baselines.py::load_xu030]
  ilgili: [rejim, baseline-1n, al-tut]

- id: rejim
  terim: Piyasa rejimi
  kategori: veri
  sade: >-
    Piyasanın yükselişte, düşüşte ya da yatay olduğu dönemlerin etiketi. Etiket yalnız o güne kadarki veriyle verilir.
  teknik: >-
    XU100 200 günlük eğilim × 60 günlük oynaklık, genişleyen tercil, ≤ t (B0 testli). Birincil etiket USD bazlı XU100
    (XU100 / USDTRY_{t−1}); nominal TL ve 5 yıllık kayan tercil duyarlılık kolları. Gerçekleşen getiriye koşullu rejim
    yazılmaz.
  kodda: [evaluation/regimes.py::regime_labels, evaluation/regimes.py::load_primary_labels]
  ilgili: [endeks-serileri, nokta-zamanlilik, getiri-birimi]

- id: evren
  terim: Sembol evreni (E0)
  kategori: veri
  sade: >-
    Sistemin işlem yaptığı 30 hissenin dondurulmuş listesi. Bugünkü gerçek BIST-30 üyeliğiyle aynı değildir.
  teknik: >-
    Tek kaynak data/universe/bist30_panel.json (RL panelinin 30 hissesi, panel sırasıyla). Elle liste yazılmaz; evren
    değişirse scripts/freeze_universe.py yeni sürüm adıyla. Tarihsel üyelik (E1) ve sektör grupları (E2) ayrı terimlerdir.
  kodda: [data/bist30_symbols.py::get_symbols, scripts/freeze_universe.py]
  belgede: [data/CLAUDE.md]
  ilgili: [bist30, tarihsel-uyelik, sektor-gruplari]

- id: tarihsel-uyelik
  terim: Tarihsel üyelik (E1)
  kategori: veri
  sade: >-
    Geçmişte hangi hissenin hangi dönemde BIST-30'da olduğu bilgisi. Bugünkü listeyi geçmişe uygulamak hayatta kalma yanlılığı yaratır.
  teknik: >-
    scripts/build_membership.py çeyreklik Borsa İstanbul duyurularından; universe_mask(date, mode) 'strict' (bilinmeyen gün
    None), 'count_checked' (sezgisel) ya da 'raw'. Dönem içi olaylar KAP'tan izlenir; iş sürüyor.
  kodda: [data/bist30_symbols.py::universe_mask, scripts/build_membership.py]
  belgede: [data/CLAUDE.md]
  ilgili: [evren, bist30, kap]

- id: sektor-gruplari
  terim: Sektör grupları (E2)
  kategori: veri
  sade: >-
    Hisselerin faaliyet alanına göre gruplanması. Ajanlar arası iletişim grafiği bu gruplardan kurulur.
  teknik: >-
    data/universe/sectors.csv, KAP alt sektörlerinden (satır başına URL, erişim tarihi, ham sayfa SHA-256); evrende 2'den az
    üyesi olanlar DİĞER grubuna düşer. load_sector_groups() ile okunur.
  kodda: [data/bist30_symbols.py::load_sector_groups, scripts/build_sectors.py]
  ilgili: [graf, kap, evren]

- id: kap
  terim: KAP
  kisaltma: KAP
  kategori: veri
  sade: >-
    Şirketlerin resmi duyurularını yaptığı Kamuyu Aydınlatma Platformu. Sektör bilgisi ve endeks olayları buradan okunur.
  teknik: >-
    Sektörler KAP gömülü verisinden; dönem içi endeks olayları VYK API'sinden (data/kap_api.py, .env anahtarı, dakikada 6
    çağrı). Test geçidinde veri yalnız 2023'ü kapsar.
  kodda: [data/kap_api.py]
  belgede: [data/CLAUDE.md]
  ilgili: [sektor-gruplari, tarihsel-uyelik]

- id: temel-veri
  terim: Temel veri (fundamentals)
  kategori: veri
  sade: >-
    Şirketlerin bilanço oranları gibi finansal tablolardan gelen bilgiler. Bu sistemde tek bir anlık görüntü olarak tutulur.
  teknik: >-
    FundamentalDataFetcher (yfinance); tek ajan faz 2 gözlemine girer. Nokta-zamanlı değildir (tek anlık oran), deneme
    kaydında fundamentals_pit açık maddesi olarak etiketlenir.
  kodda: [data/fundamental_fetcher.py::FundamentalDataFetcher]
  ilgili: [nokta-zamanlilik, protokol-acik, tek-ajan-ortami]

# ------------------------------------------------------------------ yazılım ve ürün
- id: pano
  terim: Pano (dashboard)
  kategori: yazilim
  sade: >-
    Sistemin tarayıcıda açılan arayüzü. Veri indirme, eğitim, tahmin, günlük karar ve analiz sayfaları buradadır.
  teknik: >-
    Dash uygulaması, FastAPI sunucusunun /dash/ yolunda (python run_server.py → http://localhost:8000). Sayfalar
    dashboard/pages; menü modeli tek yerde (kenar çubuğu), üst çubuk kırıntıyı ve aramayı ondan üretir.
  kodda: [dashboard/app.py, dashboard/components/sidebar.py, dashboard/components/topbar.py]
  belgede: [dashboard/CLAUDE.md]
  ilgili: [api, rehber-sayfasi, uzun-is]

- id: rehber-sayfasi
  terim: Rehber sayfası
  kategori: yazilim
  sade: >-
    Panoda sistemin ne yaptığını, nerede olduğumuzu, deneylerin ne bulduğunu ve bu sözlüğü sade dille anlatan sayfa.
  teknik: >-
    /dash/guide; içerik dashboard/content (guide.yaml, glossary.yaml elle yazılır; snapshot.json scripts/build_guide.py ile
    sistem haritası ve ölçüm JSON'larından üretilir). Üst çubuk araması sözlük terimlerine #terim-<id> çapasıyla gider.
  kodda: [dashboard/pages/guide.py, scripts/build_guide.py]
  belgede: [docs/development/system-guide-plan.md]
  ilgili: [pano, sistem-haritasi]

- id: api
  terim: API
  kisaltma: API
  kategori: yazilim
  sade: >-
    Panonun ve betiklerin sunucuya istek gönderdiği programlama arayüzü.
  teknik: >-
    FastAPI, /api/* altında (trading, prediction, hyperopt, account, admin, config). Yazma uçları RequireWriter ya da
    RequireAdmin bağımlılığı taşır; /api/* yazma isteklerinde CSRF doğrulanır. Etkileşimli belge /docs (oturumlu).
  kodda: [app/main.py, app/api/routes/trading.py, app/auth/deps.py::RequireWriter]
  ilgili: [roller, oturum, pano]

- id: roller
  terim: Roller (yönetici / kullanıcı / izleyici)
  kategori: yazilim
  sade: >-
    Kimin neyi yapabileceğini belirleyen üç yetki düzeyi. İzleyici yalnız bakar, kullanıcı kendi alanında çalışır, yönetici ayrıca hesapları yönetir.
  teknik: >-
    Role.VIEWER / USER / ADMIN; require_role, admin'i her zaman geçirir. Yazma uçları RequireWriter (user + admin),
    yönetim uçları RequireAdmin. Kayıt yoktur: hesapları yönetici açar. Yeni yazma ucunda bağımlılık atlanmaz.
  kodda: [app/auth/models.py::Role, app/auth/deps.py::require_role, app/auth/deps.py::RequireAdmin]
  belgede: [app/CLAUDE.md]
  ilgili: [calisma-alani, oturum, api, denetim-kaydi]

- id: oturum
  terim: Oturum ve çerezler
  kategori: yazilim
  sade: >-
    Giriş yapan kişinin tarayıcıda tanınmasını sağlayan kısa ve uzun ömürlü anahtarlar.
  teknik: >-
    Çerez tabanlı oturum (Dash WSGI başlık taşıyamaz): erişim ve yenileme JWT'leri, CSRF için double-submit çerezi
    (X-CSRF-Token başlığıyla eşleşmeli). Kapı middleware /dash/*, /api/* ve /docs'u korur; AUTH_ENABLED=False ile dışarı
    açılmaz.
  kodda: [app/auth/security.py::create_access_token, app/auth/security.py::csrf_matches, app/auth/middleware.py, app/auth/cookies.py::set_auth_cookies]
  belgede: [docs/development/phase-7-auth.md]
  ilgili: [roller, api]

- id: calisma-alani
  terim: Çalışma alanı
  kategori: yazilim
  sade: >-
    Her kullanıcının modellerini, sonuçlarını ve kararlarını ayrı tutan kendi klasörü. Piyasa verisi herkes için ortaktır.
  teknik: >-
    workspaces/<user_id>/; yollar app/auth/workspace.py çözümleyicisinden (models_dir, results_dir, use_workspace). Arka plan
    görevi kullanıcı kimliğini use_workspace ile taşır, aksi halde dosyalar yanlış alana yazılır. Yollar koda sabitlenmez.
  kodda: [app/auth/workspace.py::use_workspace, app/auth/workspace.py::models_dir]
  belgede: [app/CLAUDE.md]
  ilgili: [roller, uzun-is, model-meta]
  uyari: >-
    OPTUNA_STORAGE çalışma alanına göre çözülmüyor: optimizasyon çalışmaları kullanıcılar arasında ortak (bilinen gedik).

- id: denetim-kaydi
  terim: Denetim kaydı
  kategori: yazilim
  sade: >-
    Hesap açma, model silme gibi yönetimsel işlemlerin kim tarafından ne zaman yapıldığını tutan kayıt.
  teknik: >-
    service.audit; ortak model silme model.delete_shared kaydı düşer. Kullanıcı kendi etkinliğini yalnız user_id ile görür
    (yöneticinin işlemi yöneticinin kimliğini taşır, sızdırılmaz).
  kodda: [app/auth/service.py::audit, app/api/routes/admin.py]
  ilgili: [roller]

- id: uzun-is
  terim: Uzun iş (arka plan görevi)
  kategori: yazilim
  sade: >-
    Eğitim gibi dakikalar süren ve sayfayı kilitlememek için arka planda çalışan iş. İlerleme panoda ve bildirim zilinde görünür.
  teknik: >-
    background_jobs.spawn / spawn_sync (iş parçacığı, adla izlenir); kullanıcı kimliği use_workspace ile taşınır.
    Bildirimler kalıcı tablo değil, bellekteki çalışma durumlarının özetidir (/api/account/notifications).
  kodda: [app/services/background_jobs.py::spawn, app/services/background_jobs.py::is_running]
  belgede: [dashboard/CLAUDE.md]
  ilgili: [calisma-alani, eta, pano]

- id: eta
  terim: Eğitim süresi tahmini (ETA)
  kisaltma: ETA
  kategori: yazilim
  sade: >-
    Bir eğitimin ne kadar süreceğine dair başlamadan önce ve çalışırken verilen tahmin.
  teknik: >-
    toplam = hazırlık + total_timesteps × adım maliyeti(algoritma, sembol) + değerlendirme; geçmiş koşuların medyanı
    (kullanıcı başına training_eta_history.json), geçmiş yoksa yerleşik katsayı. Sembol sayısı yüklenen panelden alınır.
  kodda: [app/services/training_eta.py::estimate, app/services/training_eta.py::live_eta, app/services/training_eta.py::record_run]
  ilgili: [uzun-is]

- id: model-meta
  terim: Model meta dosyası
  kategori: yazilim
  sade: >-
    Kaydedilen her modelin yanında duran ve modelin hangi hisselerle, hangi ölçekle eğitildiğini söyleyen dosya.
  teknik: >-
    <model>.meta.json (write_model_meta): sembol evreni ve sırası, price_stats, indicator_spec, tohum. Modelin evreni adından
    çözülmez; tek gerçek kaynak modelin action_space boyutu ve bu dosyadır. Eski modeller için backfill_model_meta.py.
  kodda: [app/services/daily_trading.py::write_model_meta, app/services/daily_trading.py::resolve_trade_universe, scripts/backfill_model_meta.py]
  belgede: [app/CLAUDE.md]
  ilgili: [gunluk-karar, fiyat-olcegi, adx]

- id: gunluk-karar
  terim: Günlük karar
  kategori: yazilim
  sade: >-
    Eğitilmiş bir modelin akşam verisine bakıp ertesi gün için alım-satım önerisi üretmesi. Öneri kağıt portföye uygulanabilir.
  teknik: >-
    POST /trading/daily-decision; durum build_live_state ile kurulur, tazelik ölçütü takvim günü değil kapanmış olması
    beklenen son seanstır (last_expected_session). Canlı karar henüz model meta'sındaki ölçeği ve indicator_spec'i okumuyor
    (K13 açık iş).
  kodda: [app/services/daily_trading.py::build_live_state, app/services/daily_trading.py::last_expected_session, app/api/routes/trading.py]
  ilgili: [kagit-portfoy, model-meta]

- id: kagit-portfoy
  terim: Kağıt portföy
  kategori: yazilim
  sade: >-
    Gerçek para kullanmadan, önerilen işlemlerin sonucunu izlemek için tutulan sanal portföy.
  teknik: >-
    Tek kaynak workspaces/<uid>/data/live_trading/portfolio.json. Kâr/zarar value_portfolio ile başka günün fiyatıyla
    değerlenir; summary.daily_return_pct kâr/zarar değildir (aynı gün fiyatıyla yalnız komisyonu gösterir). Aynı tarih iki
    kez uygulanmaz (applied_dates).
  kodda: [app/services/portfolio.py::value_portfolio, app/services/portfolio.py::portfolio_path]
  belgede: [app/CLAUDE.md]
  ilgili: [gunluk-karar, calisma-alani, islem-maliyeti]

- id: golden-test
  terim: Tahmin golden testi
  kategori: yazilim
  sade: >-
    Tahmin hattının çıktısını kayıtlı bir referansla karşılaştıran test. Kırmızı olması davranışın gerçekten değiştiği anlamına gelir.
  teknik: >-
    tests/test_prediction_regression.py, CPU'ya sabit (GPU sonucu farklı). K1 gereği 2026-11-15'te bir kez CPU'da yenilendi
    (v2.0.0). Yalnız bilinçli bir davranış değişikliğinde yenilenir ve nedeni plana yazılır; --update --gpu reddedilir.
  kodda: [tests/test_prediction_regression.py]
  belgede: [tests/CLAUDE.md]
  ilgili: [k-kararlari, tahmin-ensemble, surum]

- id: surum
  terim: Sürüm (SemVer)
  kategori: yazilim
  sade: >-
    Sistemin her yayına verdiği numara. Büyük değişiklikte ilk, yeni iş paketinde ortadaki, düzeltmede son hane artar.
  teknik: >-
    Tek kaynak app/__init__.py (__version__); paket = MINOR. main korumalı (yalnız PR); birleşmeden sonra tag + gh release
    --generate-notes. Sürüm /health, RL ortam kaydı ve tahmin manifestinde görünür.
  kodda: [app/__init__.py::__version__]
  belgede: [docs/development/versioning.md]
  ilgili: [sistem-haritasi]

- id: sistem-haritasi
  terim: Sistem haritası
  kategori: yazilim
  sade: >-
    Sistemin bileşenlerini ve her birinin şu anki durumunu gösteren tek belge.
  teknik: >-
    docs/development/system-map.md: düğüm sınıfı + durum tablosu + 'Son güncelleme' satırı. Bir bileşenin durumunu
    değiştiren PR haritayı aynı PR'da günceller; Rehber'in aşama çizelgesi bu tablodan üretilir.
  kodda: [scripts/build_guide.py]
  belgede: [docs/development/system-map.md]
  ilgili: [rehber-sayfasi, surum, faz]

- id: venv-marl
  terim: venv-marl (ayrı ortam)
  kategori: yazilim
  sade: >-
    Çok ajanlı öğrenme kütüphaneleri için kurulmuş ayrı Python ortamı. Üretim kodu ona bağımlı değildir.
  teknik: >-
    K9: BenchMARL/TorchRL/PettingZoo yalnız venv-marl'da. marl/ içindeki saf çekirdek (weights, accounting, orders, obs_spec,
    panel) iki ortamda da çalışır; marl/env.py ve comm_models.py yalnız venv-marl'da. app/ ve dashboard/ bunları import etmez.
  kodda: [marl/env.py, marl/comm_models.py]
  belgede: [marl/CLAUDE.md]
  ilgili: [benchmarl, gymnasium, marl]

- id: konteyner
  terim: Konteyner (Docker)
  kategori: yazilim
  sade: >-
    Sistemin bütün bağımlılıklarıyla paketlenip tek komutla çalıştırılabilen kopyası. Kod imaja kopyalandığı için değişiklik yeniden derleme ister.
  teknik: >-
    Dockerfile + docker-compose.yml. İmaj docs/ ve *.md almaz (.dockerignore); bu yüzden panonun okuduğu içerik
    dashboard/content altında tutulur.
  kodda: [Dockerfile, docker-compose.yml]
  ilgili: [pano, rehber-sayfasi]
