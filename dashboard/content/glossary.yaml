  kategori: veri
  sade: >-
    Bütün hisselerin günlük fiyat ve göstergelerinin tarih × hisse tablosu.
  teknik: >-
    data/marl/panel_m2.npz (SHA sabit); build_arrays [T, N] diziler + risksiz faiz. Eksik hücre atılmaz: fiyat taşınır
    ve hisse o gün dondurulur. Fiyatlar yfinance düzeltilmiş.
  kodda: [marl/panel.py::build_arrays, marl/accounting.py::fill_prices]
